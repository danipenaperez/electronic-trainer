<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panelD2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="ledOnD" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <radialGradient id="ledOffD" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#c9b7b4"/><stop offset="0.5" stop-color="#9c7f7a"/><stop offset="1" stop-color="#6f5651"/></radialGradient>
    <radialGradient id="glowD" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.7"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <marker id="flowOk" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#2e8b57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="flowNo" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#A32A24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panelD2)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="410" y1="70" x2="410" y2="430" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>

  <text x="410" y="470" text-anchor="middle" font-size="13.5" font-weight="700" fill="#853B6E">EL DIODO ES UNA VÁLVULA DE UN SOLO SENTIDO</text>

  <!-- ============ A FAVOR ============ -->
  <text x="205" y="104" text-anchor="middle" font-size="18" font-weight="800" fill="#2e8b57">PATA LARGA AL + → PASA</text>
  <!-- wire -->
  <line x1="70" y1="200" x2="340" y2="200" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
  <!-- diode symbol (triangle right + cathode bar) -->
  <g><polygon points="175,178 175,222 215,200" fill="#4E5852"/><line x1="217" y1="176" x2="217" y2="224" stroke="#4E5852" stroke-width="6" stroke-linecap="round"/></g>
  <!-- flow arrows (green, rightward = allowed) -->
  <g stroke="#2e8b57" stroke-width="4" fill="none" stroke-linecap="round"><path d="M110 200 h1" marker-end="url(#flowOk)"/><path d="M270 200 h1" marker-end="url(#flowOk)"/></g>
  <!-- LED on -->
  <g><circle cx="320" cy="200" r="30" fill="url(#glowD)"/><circle cx="320" cy="200" r="15" fill="url(#ledOnD)" stroke="#8c3a32" stroke-width="1.5"/></g>
  <!-- check -->
  <text x="196" y="262" text-anchor="middle" font-size="30" font-weight="800" fill="#2e8b57">✓</text>
  <text x="205" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">a favor del diodo: la corriente pasa</text>
  <text x="205" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">y el LED ENCIENDE</text>

  <!-- ============ DEL REVÉS ============ -->
  <text x="605" y="104" text-anchor="middle" font-size="18" font-weight="800" fill="#A32A24">DEL REVÉS → BLOQUEA</text>
  <line x1="470" y1="200" x2="740" y2="200" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
  <!-- same diode orientation -->
  <g><polygon points="575,178 575,222 615,200" fill="#4E5852"/><line x1="617" y1="176" x2="617" y2="224" stroke="#4E5852" stroke-width="6" stroke-linecap="round"/></g>
  <!-- flow arrows (red, leftward = blocked): approach the bar from the right and stop -->
  <g stroke="#A32A24" stroke-width="4" fill="none" stroke-linecap="round"><path d="M710 200 h-1" marker-end="url(#flowNo)"/><path d="M665 200 h-1" marker-end="url(#flowNo)"/></g>
  <!-- blocked mark at the bar -->
  <g stroke="#A32A24" stroke-width="4" stroke-linecap="round"><line x1="632" y1="186" x2="648" y2="214"/><line x1="648" y1="186" x2="632" y2="214"/></g>
  <!-- LED off -->
  <g><circle cx="720" cy="200" r="15" fill="url(#ledOffD)" stroke="#5b4642" stroke-width="1.5"/></g>
  <text x="596" y="262" text-anchor="middle" font-size="30" font-weight="800" fill="#A32A24">✗</text>
  <text x="605" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">en contra: la válvula bloquea el paso</text>
  <text x="605" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">y el LED NO enciende</text>
</svg>
