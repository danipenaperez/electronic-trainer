<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="dome" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <linearGradient id="resB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecdcbb"/><stop offset="1" stop-color="#c5a670"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#254a75"/></linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#4a90c2"/><stop offset="1" stop-color="#25547d"/></radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2b3d6e"/><stop offset="0.5" stop-color="#3f5aa0"/><stop offset="1" stop-color="#243257"/></linearGradient>
    <linearGradient id="mm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b53a"/><stop offset="1" stop-color="#d8952a"/></linearGradient>
    <radialGradient id="coin" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#f4d982"/><stop offset="0.6" stop-color="#d6ac45"/><stop offset="1" stop-color="#a9822c"/></radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd3d6"/><stop offset="0.5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#c4c9cd"/></linearGradient>
    <pattern id="holesM" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="5" height="5" rx="1.5" fill="#b7b3a5"/></pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.16"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="560" rx="22" fill="url(#panel)"/>
  <rect x="0" y="0" width="820" height="560" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <!-- tile template: card + icon + label. 4 cols x 3 rows -->
  <!-- helper style -->
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#3a4038">
    <!-- Row 1 -->
    <g transform="translate(24,24)">
      <rect width="180" height="156" rx="14" fill="#fbfaf6" stroke="#e0dccf" filter="url(#soft)"/>
      <!-- breadboard -->
      <rect x="34" y="34" width="112" height="66" rx="8" fill="#fbfaf6" stroke="#d8d4c6"/>
      <rect x="46" y="44" width="88" height="20" fill="url(#holesM)"/>
      <rect x="46" y="72" width="88" height="20" fill="url(#holesM)"/>
      <line x1="46" y1="67" x2="134" y2="67" stroke="#d64b3f" stroke-width="1.5"/>
      <text x="90" y="130">Protoboard</text>
    </g>
    <g transform="translate(216,24)">
      <rect width="180" height="156" rx="14" fill="#fbfaf6" stroke="#e0dccf" filter="url(#soft)"/>
      <path d="M40 100 C 70 40, 110 120, 140 56" fill="none" stroke="#c0322a" stroke-width="8" stroke-linecap="round"/>
      <path d="M40 70 C 70 118, 110 44, 140 96" fill="none" stroke="#3f74b0" stroke-width="8" stroke-linecap="round"/>
      <text x="90" y="130">Cables puente</text>
    </g>
    <g transform="translate(408,24)">
      <rect width="180" height="156" rx="14" fill="#fbfaf6" stroke="#e0dccf" filter="url(#soft)"/>
      <line x1="80" y1="66" x2="80" y2="104" stroke="#9aa0a6" stroke-width="5"/>
      <line x1="100" y1="66" x2="100" y2="104" stroke="#9aa0a6" stroke-width="5"/>
      <ellipse cx="90" cy="66" rx="24" ry="8" fill="#d94636"/>
      <path d="M66 66 Q66 30 90 26 Q114 30 114 66 Z" fill="url(#dome)"/>
      <ellipse cx="81" cy="46" rx="6" ry="9" fill="#ffd9d2" opacity="0.7"/>
      <text x="90" y="130">LED</text>
    </g>
    <g transform="translate(600,24)">
      <rect width="180" height="156" rx="14" fill="#fbfaf6" stroke="#e0dccf" filter="url(#soft)"/>
      <line x1="34" y1="70" x2="146" y2="70" stroke="#9aa0a6" stroke-width="5"/>
      <rect x="54" y="52" width="72" height="36" rx="18" fill="url(#resB)" stroke="#a98950"/>
      <rect x="64" y="52" width="7" height="36" fill="#c0322a"/><rect x="76" y="52" width="7" height="36" fill="#c0322a"/><rect x="88" y="52" width="7" height="36" fill="#7a4a1e"/><rect x="112" y="52" width="6" height="36" fill="#d4af37"/>
      <text x="90" y="130">Resistencias</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(24,196)">
      <rect width="180" height="156" rx="14" fill="#fbfaf6" stroke="#e0dccf" filter="url(#soft)"/>
      <rect x="60" y="46" width="60" height="46" rx="6" fill="#e7e3d8" stroke="#c7c2b2"/>
      <rect x="66" y="52" width="48" height="34" rx="4" fill="#111418"/>
      <circle cx="90" cy="69" r="13" fill="#4a5058"/>
      <text x="90" y="130">Pulsador</text>
    </g>
    <g transform="translate(216,196)">
      <rect width="180" height="156" rx="14" fill="#fbfaf6" stroke="#e0dccf" filter="url(#soft)"/>
      <rect x="62" y="66" width="56" height="34" rx="8" fill="url(#blue)"/>
      <circle cx="90" cy="60" r="26" fill="url(#knob)" stroke="#1c3d5c"/>
      <line x1="90" y1="60" x2="106" y2="46" stroke="#eef4f8" stroke-width="4" stroke-linecap="round"/>
      <text x="90" y="130">Potenciómetro</text>
    </g>
    <g transform="translate(408,196)">
      <rect width="180" height="156" rx="14" fill="#fbfaf6" stroke="#e0dccf" filter="url(#soft)"/>
      <line x1="80" y1="70" x2="80" y2="104" stroke="#9aa0a6" stroke-width="5"/>
      <line x1="100" y1="70" x2="100" y2="104" stroke="#9aa0a6" stroke-width="5"/>
      <circle cx="90" cy="56" r="26" fill="#e6d19a" stroke="#a98950" stroke-width="2"/>
      <path d="M68 56 q6 -12 11 0 q6 12 11 0 q6 -12 11 0" fill="none" stroke="#8a6a2e" stroke-width="3"/>
      <text x="90" y="130">LDR (luz)</text>
    </g>
    <g transform="translate(600,196)">
      <rect width="180" height="156" rx="14" fill="#fbfaf6" stroke="#e0dccf" filter="url(#soft)"/>
      <line x1="82" y1="98" x2="82" y2="112" stroke="#9aa0a6" stroke-width="5"/>
      <line x1="100" y1="98" x2="100" y2="112" stroke="#9aa0a6" stroke-width="5"/>
      <rect x="70" y="44" width="44" height="58" rx="14" fill="url(#cap)" stroke="#1c274a"/>
      <rect x="70" y="44" width="12" height="58" rx="6" fill="#aab2c0" opacity="0.85"/>
      <ellipse cx="92" cy="44" rx="22" ry="6" fill="#4a63a8"/>
      <text x="90" y="130">Condensador</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(120,368)">
      <rect width="180" height="156" rx="14" fill="#fbfaf6" stroke="#e0dccf" filter="url(#soft)"/>
      <rect x="66" y="44" width="48" height="48" rx="6" fill="#1b1e22"/>
      <circle cx="90" cy="68" r="9" fill="#3a3f45"/><circle cx="90" cy="68" r="3" fill="#0c0d0f"/>
      <text x="90" y="130">Zumbador</text>
    </g>
    <g transform="translate(320,368)">
      <rect width="180" height="156" rx="14" fill="#fbfaf6" stroke="#e0dccf" filter="url(#soft)"/>
      <rect x="52" y="50" width="76" height="42" rx="8" fill="url(#blue)"/>
      <rect x="60" y="58" width="60" height="12" rx="4" fill="#eef0ec"/>
      <rect x="60" y="74" width="60" height="12" rx="4" fill="#eef0ec"/>
      <text x="90" y="130">Portapilas</text>
    </g>
    <g transform="translate(520,368)">
      <rect width="180" height="156" rx="14" fill="#fbfaf6" stroke="#e0dccf" filter="url(#soft)"/>
      <rect x="58" y="40" width="64" height="66" rx="10" fill="url(#mm)" stroke="#b57e20"/>
      <rect x="66" y="48" width="48" height="24" rx="4" fill="#bfe0cb"/>
      <text x="110" y="66" text-anchor="end" font-size="14" font-weight="800" fill="#1f4a2e" font-family="'IBM Plex Mono',monospace">4.5</text>
      <circle cx="90" cy="90" r="10" fill="#2b2f34"/>
      <text x="90" y="130">Multímetro</text>
    </g>
  </g>
</svg>
