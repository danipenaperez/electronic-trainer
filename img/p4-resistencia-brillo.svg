<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="resBody4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7d3ad"/><stop offset="0.5" stop-color="#d8bd8c"/><stop offset="1" stop-color="#bfa06b"/></linearGradient>
    <linearGradient id="leg4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd3d6"/><stop offset="0.5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#c4c9cd"/></linearGradient>
    <radialGradient id="dome4" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <radialGradient id="glowFull" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.9"/><stop offset="0.4" stop-color="#ff6a52" stop-opacity="0.4"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowMed" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.45"/><stop offset="0.4" stop-color="#ff6a52" stop-opacity="0.18"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowLow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.18"/><stop offset="0.5" stop-color="#ff6a52" stop-opacity="0.06"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <filter id="soft4" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel4)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <!-- three lanes -->
  <!-- LANE 1: 220Ω bright ; LANE 2: 1k medium ; LANE 3: 10k dim -->
  <g id="lane">
    <!-- ===== LANE 1 (x center 160) 220Ω ===== -->
    <g transform="translate(0,0)">
      <!-- resistor 220: red red brown gold -->
      <g filter="url(#soft4)">
        <line x1="160" y1="120" x2="160" y2="250" stroke="url(#leg4)" stroke-width="5"/>
        <rect x="142" y="150" width="36" height="86" rx="18" fill="url(#resBody4)" stroke="#a98950" stroke-width="1"/>
        <rect x="142" y="164" width="36" height="8" fill="#c0322a"/>
        <rect x="142" y="178" width="36" height="8" fill="#c0322a"/>
        <rect x="142" y="192" width="36" height="8" fill="#7a4a1e"/>
        <rect x="142" y="216" width="36" height="7" fill="#d4af37"/>
      </g>
      <!-- LED bright -->
      <circle cx="160" cy="300" r="72" fill="url(#glowFull)"/>
      <g filter="url(#soft4)">
        <ellipse cx="160" cy="300" rx="26" ry="9" fill="#d94636"/>
        <path d="M135 300 Q135 262 160 258 Q185 262 185 300 Z" fill="url(#dome4)"/>
        <ellipse cx="151" cy="278" rx="7" ry="11" fill="#ffd9d2" opacity="0.75"/>
      </g>
      <!-- value chip -->
      <rect x="112" y="392" width="96" height="34" rx="17" fill="#ffffff" stroke="#d8d0be" stroke-width="1.5"/>
      <text x="160" y="415" text-anchor="middle" font-size="18" font-weight="700" fill="#8c4320">220 Ω</text>
      <text x="160" y="452" text-anchor="middle" font-size="15" font-weight="600" fill="#5f6b5f">brilla fuerte</text>
    </g>

    <!-- ===== LANE 2 (x center 410) 1kΩ ===== -->
    <g transform="translate(0,0)">
      <g filter="url(#soft4)">
        <line x1="410" y1="120" x2="410" y2="250" stroke="url(#leg4)" stroke-width="5"/>
        <rect x="392" y="150" width="36" height="86" rx="18" fill="url(#resBody4)" stroke="#a98950" stroke-width="1"/>
        <rect x="392" y="164" width="36" height="8" fill="#7a4a1e"/>
        <rect x="392" y="178" width="36" height="8" fill="#1a1a1a"/>
        <rect x="392" y="192" width="36" height="8" fill="#c0322a"/>
        <rect x="392" y="216" width="36" height="7" fill="#d4af37"/>
      </g>
      <circle cx="410" cy="300" r="60" fill="url(#glowMed)"/>
      <g filter="url(#soft4)">
        <ellipse cx="410" cy="300" rx="26" ry="9" fill="#c53f30"/>
        <path d="M385 300 Q385 262 410 258 Q435 262 435 300 Z" fill="url(#dome4)"/>
        <ellipse cx="401" cy="278" rx="7" ry="11" fill="#ffd9d2" opacity="0.55"/>
      </g>
      <rect x="362" y="392" width="96" height="34" rx="17" fill="#ffffff" stroke="#d8d0be" stroke-width="1.5"/>
      <text x="410" y="415" text-anchor="middle" font-size="18" font-weight="700" fill="#8c4320">1 kΩ</text>
      <text x="410" y="452" text-anchor="middle" font-size="15" font-weight="600" fill="#5f6b5f">más flojo</text>
    </g>

    <!-- ===== LANE 3 (x center 660) 10kΩ ===== -->
    <g transform="translate(0,0)">
      <g filter="url(#soft4)">
        <line x1="660" y1="120" x2="660" y2="250" stroke="url(#leg4)" stroke-width="5"/>
        <rect x="642" y="150" width="36" height="86" rx="18" fill="url(#resBody4)" stroke="#a98950" stroke-width="1"/>
        <rect x="642" y="164" width="36" height="8" fill="#7a4a1e"/>
        <rect x="642" y="178" width="36" height="8" fill="#1a1a1a"/>
        <rect x="642" y="192" width="36" height="8" fill="#e8730c"/>
        <rect x="642" y="216" width="36" height="7" fill="#d4af37"/>
      </g>
      <circle cx="660" cy="300" r="46" fill="url(#glowLow)"/>
      <g filter="url(#soft4)">
        <ellipse cx="660" cy="300" rx="26" ry="9" fill="#a8382b"/>
        <path d="M635 300 Q635 262 660 258 Q685 262 685 300 Z" fill="url(#dome4)" opacity="0.9"/>
        <ellipse cx="651" cy="278" rx="6" ry="9" fill="#ffd9d2" opacity="0.35"/>
      </g>
      <rect x="612" y="392" width="96" height="34" rx="17" fill="#ffffff" stroke="#d8d0be" stroke-width="1.5"/>
      <text x="660" y="415" text-anchor="middle" font-size="18" font-weight="700" fill="#8c4320">10 kΩ</text>
      <text x="660" y="452" text-anchor="middle" font-size="15" font-weight="600" fill="#5f6b5f">casi apagado</text>
    </g>
  </g>

  <!-- arrow more resistance -> less light -->
  <line x1="120" y1="60" x2="700" y2="60" stroke="#c9b48a" stroke-width="3" stroke-linecap="round"/>
  <path d="M700 60 l-14 -7 l0 14 z" fill="#c9b48a"/>
  <text x="410" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#8a7c5c" letter-spacing="0.03em">más resistencia  →  menos corriente  →  menos brillo</text>
</svg>
