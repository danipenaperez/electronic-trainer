<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panelMo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="motorBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6e8ea"/><stop offset="0.5" stop-color="#c2c7cc"/><stop offset="1" stop-color="#a7adb4"/></linearGradient>
    <linearGradient id="battMo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#254a75"/></linearGradient>
    <linearGradient id="bladeOn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6564a"/><stop offset="1" stop-color="#c0322a"/></linearGradient>
    <linearGradient id="bladeOff" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7bcc2"/><stop offset="1" stop-color="#9aa0a6"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panelMo)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="410" y1="70" x2="410" y2="420" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="410" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#0E6274">LA CORRIENTE NO SOLO ENCIENDE: TAMBIÉN MUEVE COSAS</text>

  <!-- ============ ABIERTO (parada) ============ -->
  <text x="205" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">INTERRUPTOR ABIERTO</text>
  <!-- circuit -->
  <g stroke="#6b7280" stroke-width="6" fill="none" stroke-linecap="round"><path d="M120 330 V 250"/><path d="M120 250 H 165"/><path d="M235 250 H 300 V 230"/><path d="M300 330 H 120"/></g>
  <!-- open switch -->
  <circle cx="165" cy="250" r="5" fill="#363b41"/><circle cx="215" cy="250" r="5" fill="#363b41"/>
  <line x1="165" y1="250" x2="205" y2="232" stroke="#363b41" stroke-width="6" stroke-linecap="round"/>
  <!-- motor + still blades -->
  <g><rect x="270" y="200" width="60" height="44" rx="10" fill="url(#motorBody)" stroke="#9aa0a6"/><circle cx="300" cy="196" r="6" fill="#7d818a"/>
    <g transform="translate(300,160)"><ellipse cx="0" cy="0" rx="46" ry="12" fill="url(#bladeOff)"/><ellipse cx="0" cy="0" rx="12" ry="46" fill="url(#bladeOff)"/><circle cx="0" cy="0" r="7" fill="#7d818a"/></g></g>
  <!-- battery -->
  <g><rect x="110" y="330" width="130" height="42" rx="8" fill="url(#battMo)"/><rect x="121" y="338" width="108" height="11" rx="3" fill="#eef0ec"/><rect x="121" y="353" width="108" height="11" rx="3" fill="#eef0ec"/></g>
  <text x="205" y="404" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">no pasa corriente → la hélice está parada</text>

  <!-- ============ CERRADO (gira) ============ -->
  <text x="605" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">INTERRUPTOR CERRADO</text>
  <g stroke="#6b7280" stroke-width="6" fill="none" stroke-linecap="round"><path d="M520 330 V 250"/><path d="M520 250 H 615"/><path d="M635 250 H 700 V 230"/><path d="M700 330 H 520"/></g>
  <!-- closed switch -->
  <circle cx="565" cy="250" r="5" fill="#363b41"/><circle cx="615" cy="250" r="5" fill="#363b41"/>
  <line x1="565" y1="250" x2="615" y2="250" stroke="#363b41" stroke-width="6" stroke-linecap="round"/>
  <!-- motion arcs -->
  <g stroke="#B0562A" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M700 108 A 52 52 0 0 1 748 148"/><path d="M652 212 A 52 52 0 0 1 668 172"/>
    <path d="M735 210 A 52 52 0 0 0 750 172"/>
  </g>
  <!-- motor + spinning blades -->
  <g><rect x="670" y="200" width="60" height="44" rx="10" fill="url(#motorBody)" stroke="#9aa0a6"/><circle cx="700" cy="196" r="6" fill="#7d818a"/>
    <g transform="translate(700,160) rotate(25)"><ellipse cx="0" cy="0" rx="48" ry="11" fill="url(#bladeOn)"/><ellipse cx="0" cy="0" rx="11" ry="48" fill="url(#bladeOn)"/><circle cx="0" cy="0" r="7" fill="#7d818a"/></g></g>
  <g><rect x="510" y="330" width="130" height="42" rx="8" fill="url(#battMo)"/><rect x="521" y="338" width="108" height="11" rx="3" fill="#eef0ec"/><rect x="521" y="353" width="108" height="11" rx="3" fill="#eef0ec"/></g>
  <text x="605" y="404" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">pasa corriente → el motor gira la hélice</text>
</svg>
