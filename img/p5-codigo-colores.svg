<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="resBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecdcbb"/><stop offset="0.5" stop-color="#ddc492"/><stop offset="1" stop-color="#c5a670"/></linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd3d6"/><stop offset="0.5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#c4c9cd"/></linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <!-- giant resistor, 220 ohm: red red brown gold -->
  <g filter="url(#soft)">
    <line x1="80" y1="180" x2="740" y2="180" stroke="url(#leg)" stroke-width="10"/>
    <rect x="210" y="120" width="400" height="120" rx="60" fill="url(#resBody)" stroke="#a98950" stroke-width="2"/>
    <!-- bands -->
    <rect x="266" y="120" width="30" height="120" fill="#c0322a"/>
    <rect x="320" y="120" width="30" height="120" fill="#c0322a"/>
    <rect x="374" y="120" width="30" height="120" fill="#7a4a1e"/>
    <rect x="520" y="120" width="26" height="120" fill="#d4af37"/>
  </g>

  <!-- callouts under bands -->
  <g text-anchor="middle" font-weight="700">
    <line x1="281" y1="240" x2="281" y2="290" stroke="#b8a06a" stroke-width="2"/>
    <line x1="335" y1="240" x2="335" y2="290" stroke="#b8a06a" stroke-width="2"/>
    <line x1="389" y1="240" x2="389" y2="290" stroke="#b8a06a" stroke-width="2"/>
    <line x1="533" y1="240" x2="533" y2="290" stroke="#b8a06a" stroke-width="2"/>

    <g transform="translate(281,300)"><circle r="26" fill="#c0322a"/><text y="7" font-size="24" fill="#fff">2</text></g>
    <g transform="translate(335,300)"><circle r="26" fill="#c0322a"/><text y="7" font-size="24" fill="#fff">2</text></g>
    <g transform="translate(389,300)"><circle r="26" fill="#7a4a1e"/><text y="7" font-size="20" fill="#fff">×10</text></g>
    <g transform="translate(533,300)"><circle r="26" fill="#d4af37"/><text y="6" font-size="13" fill="#5a4a12">±5%</text></g>

    <text x="281" y="352" font-size="14" fill="#6a6152">cifra</text>
    <text x="335" y="352" font-size="14" fill="#6a6152">cifra</text>
    <text x="389" y="352" font-size="14" fill="#6a6152">ceros</text>
    <text x="533" y="352" font-size="14" fill="#6a6152">tolerancia</text>
  </g>

  <!-- result -->
  <g filter="url(#soft)">
    <rect x="250" y="392" width="320" height="66" rx="33" fill="#ffffff" stroke="#d8d0be" stroke-width="2"/>
    <text x="410" y="435" text-anchor="middle" font-size="30" font-weight="800" fill="#8c4320">2 2 “0” = 220 Ω</text>
  </g>
</svg>
