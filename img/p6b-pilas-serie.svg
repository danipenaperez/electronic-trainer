<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panelPS2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="battPS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#254a75"/></linearGradient>
    <radialGradient id="ledN" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ffab9f"/><stop offset="0.5" stop-color="#ef6a5c"/><stop offset="1" stop-color="#bd493f"/></radialGradient>
    <radialGradient id="ledBright" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <radialGradient id="glowN" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.35"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowBr" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.75"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panelPS2)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="410" y1="70" x2="410" y2="410" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="410" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#0E6274">EN SERIE LOS VOLTAJES SE SUMAN → más presión (empuje) → más corriente</text>

  <!-- ============ 1 PILA ============ -->
  <text x="205" y="104" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">1 PILA</text>
  <g><rect x="150" y="140" width="110" height="50" rx="9" fill="url(#battPS)"/><rect x="162" y="150" width="86" height="12" rx="4" fill="#eef0ec"/><rect x="162" y="168" width="86" height="12" rx="4" fill="#eef0ec"/><text x="168" y="135" font-size="13" font-weight="700" fill="#254a75">＋</text><text x="238" y="135" font-size="15" font-weight="700" fill="#254a75">−</text></g>
  <text x="205" y="228" text-anchor="middle" font-size="22" font-weight="800" fill="#0E6274">1,5 V</text>
  <!-- push arrow (small) -->
  <path d="M150 275 L235 275" fill="none" stroke="#B0562A" stroke-width="7" stroke-linecap="round"/>
  <path d="M232 265 L250 275 L232 285 Z" fill="#B0562A"/>
  <text x="200" y="304" text-anchor="middle" font-size="12" fill="#4E5852">empuje pequeño</text>
  <!-- LED normal -->
  <g><circle cx="205" cy="350" r="26" fill="url(#glowN)"/><circle cx="205" cy="350" r="15" fill="url(#ledN)" stroke="#8c3a32" stroke-width="1.5"/></g>

  <!-- ============ 3 EN SERIE ============ -->
  <text x="605" y="104" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">3 PILAS EN SERIE</text>
  <!-- three batteries chained + to - -->
  <g>
    <rect x="500" y="146" width="66" height="44" rx="7" fill="url(#battPS)"/><rect x="509" y="154" width="48" height="11" rx="3" fill="#eef0ec"/><rect x="509" y="170" width="48" height="11" rx="3" fill="#eef0ec"/>
    <rect x="576" y="146" width="66" height="44" rx="7" fill="url(#battPS)"/><rect x="585" y="154" width="48" height="11" rx="3" fill="#eef0ec"/><rect x="585" y="170" width="48" height="11" rx="3" fill="#eef0ec"/>
    <rect x="652" y="146" width="66" height="44" rx="7" fill="url(#battPS)"/><rect x="661" y="154" width="48" height="11" rx="3" fill="#eef0ec"/><rect x="661" y="170" width="48" height="11" rx="3" fill="#eef0ec"/>
    <line x1="566" y1="168" x2="576" y2="168" stroke="#6b7280" stroke-width="4"/><line x1="642" y1="168" x2="652" y2="168" stroke="#6b7280" stroke-width="4"/>
    <text x="504" y="140" font-size="11" font-weight="700" fill="#254a75">＋</text><text x="712" y="140" font-size="13" font-weight="700" fill="#254a75">−</text>
  </g>
  <text x="609" y="228" text-anchor="middle" font-size="22" font-weight="800" fill="#0E6274">1,5 + 1,5 + 1,5 = 4,5 V</text>
  <!-- push arrow (big) -->
  <path d="M500 278 L680 278" fill="none" stroke="#B0562A" stroke-width="13" stroke-linecap="round"/>
  <path d="M676 262 L706 278 L676 294 Z" fill="#B0562A"/>
  <text x="590" y="310" text-anchor="middle" font-size="12" fill="#4E5852">mucho más empuje</text>
  <!-- LED bright -->
  <g><circle cx="605" cy="356" r="34" fill="url(#glowBr)"/><circle cx="605" cy="356" r="16" fill="url(#ledBright)" stroke="#8c3a32" stroke-width="1.5"/></g>
</svg>
