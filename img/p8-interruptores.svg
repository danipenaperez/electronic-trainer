<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.85"/><stop offset="0.4" stop-color="#ff6a52" stop-opacity="0.35"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="dome" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <linearGradient id="btnTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6068"/><stop offset="1" stop-color="#2f343a"/></linearGradient>
    <linearGradient id="wireK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f45"/><stop offset="1" stop-color="#1c1f24"/></linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7dade"/><stop offset="1" stop-color="#9aa0a6"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c98f"/><stop offset="1" stop-color="#d3a862"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <line x1="410" y1="70" x2="410" y2="430" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="205" y="96" text-anchor="middle" font-size="18" font-weight="800" fill="#2b3330">Pulsador del kit</text>
  <text x="615" y="96" text-anchor="middle" font-size="18" font-weight="800" fill="#2b3330">Interruptor casero</text>

  <!-- LEFT: pushbutton in circuit -->
  <g>
    <rect x="90" y="180" width="230" height="150" rx="14" fill="none" stroke="url(#wireK)" stroke-width="9"/>
    <!-- LED top -->
    <circle cx="205" cy="180" r="44" fill="url(#glowB)"/>
    <g filter="url(#soft)"><ellipse cx="205" cy="180" rx="22" ry="8" fill="#d94636"/><path d="M183 180 Q183 148 205 145 Q227 148 227 180 Z" fill="url(#dome)"/></g>
    <!-- pushbutton on bottom wire -->
    <g filter="url(#soft)">
      <rect x="172" y="308" width="66" height="44" rx="6" fill="#e7e3d8" stroke="#c7c2b2"/>
      <rect x="176" y="312" width="58" height="36" rx="4" fill="#111418"/>
      <circle cx="205" cy="330" r="14" fill="url(#btnTop)"/>
      <circle cx="200" cy="325" r="4" fill="#8a9096" opacity="0.7"/>
    </g>
    <text x="205" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6b5f">pulsas → cierra el paso</text>
  </g>

  <!-- RIGHT: clothespin / clip switch -->
  <g>
    <rect x="500" y="180" width="230" height="150" rx="14" fill="none" stroke="url(#wireK)" stroke-width="9"/>
    <circle cx="615" cy="180" r="44" fill="url(#glowB)"/>
    <g filter="url(#soft)"><ellipse cx="615" cy="180" rx="22" ry="8" fill="#d94636"/><path d="M593 180 Q593 148 615 145 Q637 148 637 180 Z" fill="url(#dome)"/></g>
    <!-- gap in bottom wire filled by clothespin with foil contacts -->
    <rect x="560" y="318" width="110" height="18" fill="url(#panel)"/>
    <g filter="url(#soft)">
      <!-- clothespin -->
      <path d="M556 300 L676 300 L672 348 L560 348 Z" fill="url(#wood)" stroke="#b78a4c"/>
      <line x1="616" y1="300" x2="614" y2="348" stroke="#b78a4c" stroke-width="2"/>
      <!-- foil pads -->
      <rect x="576" y="322" width="30" height="12" rx="3" fill="url(#clip)"/>
      <rect x="626" y="322" width="30" height="12" rx="3" fill="url(#clip)"/>
    </g>
    <text x="615" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6b5f">dos trozos de papel Alu que se tocan</text>
  </g>
</svg>
