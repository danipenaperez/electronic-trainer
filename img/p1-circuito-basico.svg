<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe6"/>
      <stop offset="1" stop-color="#e8e2d4"/>
    </linearGradient>
    <linearGradient id="battBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6ea5"/>
      <stop offset="1" stop-color="#254a75"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2ee"/>
      <stop offset="0.5" stop-color="#c9cbc4"/>
      <stop offset="1" stop-color="#9a9c94"/>
    </linearGradient>
    <linearGradient id="cellTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9c86a"/>
      <stop offset="1" stop-color="#b8912f"/>
    </linearGradient>
    <linearGradient id="resBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d3ad"/>
      <stop offset="0.5" stop-color="#d8bd8c"/>
      <stop offset="1" stop-color="#bfa06b"/>
    </linearGradient>
    <radialGradient id="ledGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a4d" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#ff6a52" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6a52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledDome" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff9a8f"/>
      <stop offset="0.5" stop-color="#f2493a"/>
      <stop offset="1" stop-color="#c0261b"/>
    </radialGradient>
    <linearGradient id="wireR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6564a"/><stop offset="1" stop-color="#c0322a"/></linearGradient>
    <linearGradient id="wireK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f45"/><stop offset="1" stop-color="#1c1f24"/></linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd3d6"/><stop offset="0.5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#c4c9cd"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>

  <!-- workbench panel -->
  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <!-- ===== WIRES (drawn first, under parts) ===== -->
  <!-- red wire: battery + -> resistor left -->
  <path d="M245 300 C 300 260, 300 190, 330 178" fill="none" stroke="url(#wireR)" stroke-width="11" stroke-linecap="round"/>
  <!-- resistor right -> LED long leg (anode) : short metal already; add small wire -->
  <path d="M470 178 C 520 178, 545 200, 560 246" fill="none" stroke="#9aa0a6" stroke-width="7" stroke-linecap="round"/>
  <!-- black wire: LED short leg (cathode) -> battery - -->
  <path d="M600 300 C 610 380, 360 420, 205 372" fill="none" stroke="url(#wireK)" stroke-width="11" stroke-linecap="round"/>

  <!-- ===== BATTERY HOLDER (2xAA) ===== -->
  <g filter="url(#soft)">
    <rect x="70" y="300" width="180" height="86" rx="12" fill="url(#battBody)"/>
    <!-- two cells -->
    <rect x="86" y="312" width="148" height="26" rx="8" fill="url(#cell)" stroke="#7d7f78" stroke-width="1"/>
    <rect x="86" y="312" width="20" height="26" rx="6" fill="url(#cellTop)"/>
    <rect x="86" y="348" width="148" height="26" rx="8" fill="url(#cell)" stroke="#7d7f78" stroke-width="1"/>
    <rect x="214" y="348" width="20" height="26" rx="6" fill="url(#cellTop)"/>
    <text x="120" y="330" font-size="15" font-weight="700" fill="#5f6158">＋</text>
    <text x="196" y="368" font-size="17" font-weight="700" fill="#5f6158">−</text>
  </g>
  <!-- battery terminals to wires -->
  <circle cx="245" cy="300" r="5" fill="#c0322a"/>
  <circle cx="205" cy="372" r="5" fill="#1c1f24"/>

  <!-- ===== RESISTOR (220Ω: red red brown gold) ===== -->
  <g filter="url(#soft)">
    <line x1="322" y1="178" x2="478" y2="178" stroke="url(#leg)" stroke-width="5"/>
    <rect x="352" y="160" width="96" height="36" rx="18" fill="url(#resBody)" stroke="#a98950" stroke-width="1"/>
    <rect x="368" y="160" width="9" height="36" fill="#c0322a"/>
    <rect x="384" y="160" width="9" height="36" fill="#c0322a"/>
    <rect x="400" y="160" width="9" height="36" fill="#7a4a1e"/>
    <rect x="428" y="160" width="8" height="36" fill="#d4af37"/>
  </g>

  <!-- ===== LED (lit) ===== -->
  <circle cx="580" cy="248" r="82" fill="url(#ledGlow)"/>
  <!-- legs -->
  <path d="M566 300 L560 246" stroke="url(#leg)" stroke-width="6" stroke-linecap="round"/>
  <path d="M596 300 L600 258" stroke="url(#leg)" stroke-width="6" stroke-linecap="round"/>
  <g filter="url(#soft)">
    <!-- flange base -->
    <ellipse cx="580" cy="258" rx="30" ry="10" fill="#d94636"/>
    <!-- dome -->
    <path d="M551 258 Q551 214 580 210 Q609 214 609 258 Z" fill="url(#ledDome)"/>
    <ellipse cx="571" cy="232" rx="9" ry="13" fill="#ffd9d2" opacity="0.7"/>
  </g>

  <!-- gentle contact dots where wires meet legs -->
  <circle cx="560" cy="246" r="4.5" fill="#9aa0a6"/>
  <circle cx="600" cy="300" r="5" fill="#1c1f24"/>
</svg>
