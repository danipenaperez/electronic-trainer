<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.85"/><stop offset="0.4" stop-color="#ff6a52" stop-opacity="0.35"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowM" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.4"/><stop offset="0.4" stop-color="#ff6a52" stop-opacity="0.15"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="dome" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#4a90c2"/><stop offset="1" stop-color="#25547d"/></radialGradient>
    <linearGradient id="potBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#254a75"/></linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd3d6"/><stop offset="0.5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#c4c9cd"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <!-- potentiometer left -->
  <g filter="url(#soft)">
    <rect x="150" y="230" width="150" height="120" rx="14" fill="url(#potBody)"/>
    <!-- 3 legs bottom -->
    <line x1="185" y1="350" x2="185" y2="392" stroke="url(#leg)" stroke-width="7"/>
    <line x1="225" y1="350" x2="225" y2="392" stroke="url(#leg)" stroke-width="7"/>
    <line x1="265" y1="350" x2="265" y2="392" stroke="url(#leg)" stroke-width="7"/>
    <!-- knob -->
    <circle cx="225" cy="230" r="58" fill="url(#knob)" stroke="#1c3d5c" stroke-width="2"/>
    <circle cx="225" cy="230" r="46" fill="none" stroke="#5fa0d0" stroke-width="2" opacity="0.5"/>
    <!-- pointer -->
    <line x1="225" y1="230" x2="258" y2="200" stroke="#eef4f8" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- rotation arrow -->
  <path d="M150 150 A 90 90 0 0 1 300 150" fill="none" stroke="#8a7c5c" stroke-width="3" stroke-linecap="round"/>
  <path d="M300 150 l-4 -14 l14 4 z" fill="#8a7c5c"/>
  <text x="225" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#8a7c5c">gíralo</text>

  <!-- wire to LED -->
  <path d="M265 392 C 340 420, 430 400, 470 340" fill="none" stroke="#3b3f45" stroke-width="9" stroke-linecap="round"/>
  <path d="M185 392 C 150 430, 520 460, 560 380" fill="none" stroke="#c0322a" stroke-width="9" stroke-linecap="round"/>

  <!-- LED brightness scale (three ghost states + one strong) -->
  <g>
    <circle cx="560" cy="250" r="70" fill="url(#glowB)"/>
    <g filter="url(#soft)"><ellipse cx="560" cy="250" rx="26" ry="9" fill="#d94636"/><path d="M535 250 Q535 212 560 208 Q585 212 585 250 Z" fill="url(#dome)"/>
      <ellipse cx="551" cy="228" rx="7" ry="11" fill="#ffd9d2" opacity="0.7"/></g>
  </g>
  <!-- dimmer scale bar -->
  <g transform="translate(430,392)">
    <rect x="0" y="0" width="300" height="20" rx="10" fill="#e2ddcf"/>
    <rect x="0" y="0" width="210" height="20" rx="10" fill="#e08a3c"/>
    <text x="150" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6b5f">de brillo fuerte a casi apagado, suave</text>
  </g>
</svg>
