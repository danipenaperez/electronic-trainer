<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.85"/><stop offset="0.4" stop-color="#ff6a52" stop-opacity="0.35"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowM" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.4"/><stop offset="0.4" stop-color="#ff6a52" stop-opacity="0.15"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="dome" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#4a90c2"/><stop offset="1" stop-color="#25547d"/></radialGradient>
    <linearGradient id="potBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#254a75"/></linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd3d6"/><stop offset="0.5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#c4c9cd"/></linearGradient>
    <linearGradient id="resB9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7d3ad"/><stop offset="0.5" stop-color="#d8bd8c"/><stop offset="1" stop-color="#bfa06b"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <!-- potentiometer left -->
  <g filter="url(#soft)">
    <rect x="150" y="230" width="150" height="120" rx="14" fill="url(#potBody)"/>
    <!-- 3 legs bottom (se usan la izquierda y la del medio; la 3ª queda libre) -->
    <line x1="185" y1="346" x2="185" y2="402" stroke="#9aa0a6" stroke-width="8" stroke-linecap="round"/>
    <line x1="225" y1="346" x2="225" y2="402" stroke="#9aa0a6" stroke-width="8" stroke-linecap="round"/>
    <line x1="265" y1="346" x2="265" y2="384" stroke="#9aa0a6" stroke-width="8" stroke-linecap="round"/>
    <!-- knob -->
    <circle cx="225" cy="230" r="58" fill="url(#knob)" stroke="#1c3d5c" stroke-width="2"/>
    <circle cx="225" cy="230" r="46" fill="none" stroke="#5fa0d0" stroke-width="2" opacity="0.5"/>
    <!-- pointer -->
    <line x1="225" y1="230" x2="258" y2="200" stroke="#eef4f8" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- rotation arrow -->
  <path d="M150 150 A 90 90 0 0 1 300 150" fill="none" stroke="#8a7c5c" stroke-width="3" stroke-linecap="round"/>
  <path d="M300 150 l-4 -14 l14 4 z" fill="#8a7c5c"/>
  <text x="225" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#8a7c5c">gíralo</text>

  <!-- pila -->
  <g filter="url(#soft)">
    <rect x="300" y="418" width="132" height="42" rx="9" fill="url(#potBody)"/>
    <rect x="312" y="427" width="108" height="10" rx="3" fill="#eef0ec"/><rect x="312" y="441" width="108" height="10" rx="3" fill="#eef0ec"/>
    <text x="307" y="413" font-size="12" font-weight="700" fill="#254a75">＋</text><text x="420" y="413" font-size="13" font-weight="700" fill="#254a75">−</text>
  </g>
  <!-- red wire: pila+ -> pot left leg -->
  <path d="M312 421 C 262 416, 208 412, 185 402" fill="none" stroke="#c0322a" stroke-width="8" stroke-linecap="round"/>
  <!-- gray wire: pot middle leg (cursor) -> resistor -> LED -->
  <path d="M225 402 C 288 412, 356 374, 396 356" fill="none" stroke="#9aa0a6" stroke-width="8" stroke-linecap="round"/>
  <path d="M458 352 C 500 340, 526 320, 548 302" fill="none" stroke="#9aa0a6" stroke-width="8" stroke-linecap="round"/>
  <!-- connection dots on the pot legs -->
  <circle cx="185" cy="401" r="5.5" fill="#9a241c"/>
  <circle cx="225" cy="401" r="5.5" fill="#5a5f66"/>
  <!-- resistor -->
  <g filter="url(#soft)">
    <rect x="394" y="341" width="66" height="24" rx="12" fill="url(#resB9)" stroke="#a98950"/>
    <rect x="406" y="341" width="6" height="24" fill="#c0322a"/>
    <rect x="417" y="341" width="6" height="24" fill="#c0322a"/>
    <rect x="428" y="341" width="6" height="24" fill="#7a4a1e"/>
    <rect x="444" y="341" width="5" height="24" fill="#d4af37"/>
  </g>
  <path d="M574 302 C 566 372, 476 414, 420 419" fill="none" stroke="#1c1f24" stroke-width="8" stroke-linecap="round"/>
  <!-- LED (connected) -->
  <g>
    <path d="M550 300 L554 262" stroke="url(#leg)" stroke-width="5" stroke-linecap="round"/>
    <path d="M572 300 L568 264" stroke="url(#leg)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="560" cy="250" r="66" fill="url(#glowB)"/>
    <g filter="url(#soft)"><ellipse cx="560" cy="250" rx="26" ry="9" fill="#d94636"/><path d="M534 250 Q534 212 560 208 Q586 212 586 250 Z" fill="url(#dome)"/>
      <ellipse cx="551" cy="228" rx="7" ry="11" fill="#ffd9d2" opacity="0.7"/></g>
  </g>
  <text x="470" y="488" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6b5f">giras el mando → cambias el brillo del LED: de fuerte a casi apagado</text>
</svg>
