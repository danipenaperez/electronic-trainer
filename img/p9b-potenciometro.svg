<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panelPo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6169"/><stop offset="1" stop-color="#363b41"/></linearGradient>
    <radialGradient id="ledBr9" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <radialGradient id="ledDm9" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#efbcb5"/><stop offset="0.5" stop-color="#cf8078"/><stop offset="1" stop-color="#9c534b"/></radialGradient>
    <radialGradient id="glow9" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.7"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow9d" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.25"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panelPo)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="410" y1="70" x2="410" y2="420" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="410" y="468" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9E7115">POR DENTRO: un caminito resistivo y un cursor que se desliza al girar</text>

  <!-- ============ GIRADO POCO ============ -->
  <text x="205" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">GIRADO POCO</text>
  <!-- knob -->
  <g><circle cx="205" cy="150" r="26" fill="url(#knob)"/><line x1="205" y1="150" x2="188" y2="136" stroke="#f3efe6" stroke-width="4" stroke-linecap="round"/></g>
  <!-- resistive track -->
  <rect x="110" y="228" width="190" height="16" rx="8" fill="#cdd2d6"/>
  <!-- active (traveled) portion in copper -->
  <rect x="110" y="228" width="45" height="16" rx="8" fill="#B0562A"/>
  <!-- wiper -->
  <line x1="155" y1="192" x2="155" y2="228" stroke="#363b41" stroke-width="4"/>
  <path d="M147 214 L163 214 L155 230 Z" fill="#363b41"/>
  <!-- current in + out -->
  <path d="M78 236 L104 236" fill="none" stroke="#B0562A" stroke-width="4" stroke-linecap="round"/><path d="M100 230 L112 236 L100 242 Z" fill="#B0562A"/>
  <text x="205" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#B0562A">poco camino → POCA resistencia</text>
  <!-- LED bright -->
  <g><circle cx="205" cy="336" r="30" fill="url(#glow9)"/><circle cx="205" cy="336" r="15" fill="url(#ledBr9)" stroke="#8c3a32" stroke-width="1.5"/></g>
  <text x="205" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">el LED brilla más</text>

  <!-- ============ GIRADO MUCHO ============ -->
  <text x="605" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">GIRADO MUCHO</text>
  <g><circle cx="605" cy="150" r="26" fill="url(#knob)"/><line x1="605" y1="150" x2="626" y2="146" stroke="#f3efe6" stroke-width="4" stroke-linecap="round"/></g>
  <rect x="510" y="228" width="190" height="16" rx="8" fill="#cdd2d6"/>
  <rect x="510" y="228" width="155" height="16" rx="8" fill="#B0562A"/>
  <line x1="665" y1="192" x2="665" y2="228" stroke="#363b41" stroke-width="4"/>
  <path d="M657 214 L673 214 L665 230 Z" fill="#363b41"/>
  <path d="M478 236 L504 236" fill="none" stroke="#B0562A" stroke-width="4" stroke-linecap="round"/><path d="M500 230 L512 236 L500 242 Z" fill="#B0562A"/>
  <text x="605" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#B0562A">mucho camino → MUCHA resistencia</text>
  <g><circle cx="605" cy="336" r="20" fill="url(#glow9d)"/><circle cx="605" cy="336" r="15" fill="url(#ledDm9)" stroke="#8c3a32" stroke-width="1.5"/></g>
  <text x="605" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">el LED brilla menos</text>
</svg>
