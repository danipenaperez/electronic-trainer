<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panelCo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="probeR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6564a"/><stop offset="1" stop-color="#c0322a"/></linearGradient>
    <linearGradient id="probeK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f45"/><stop offset="1" stop-color="#1c1f24"/></linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd3d6"/><stop offset="0.5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#c4c9cd"/></linearGradient>
    <linearGradient id="wireCo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7a24a"/><stop offset="1" stop-color="#b07d2a"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panelCo)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="410" y1="70" x2="410" y2="430" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="410" y="468" text-anchor="middle" font-size="13.5" font-weight="700" fill="#853B6E">MODO CONTINUIDAD (•)))  ): SI HAY CAMINO, PITA</text>

  <!-- ============ CONDUCE → PITA ============ -->
  <text x="205" y="102" text-anchor="middle" font-size="18" font-weight="800" fill="#2e8b57">CONDUCE → PITA</text>
  <!-- metal wire being tested (whole) -->
  <rect x="120" y="252" width="170" height="14" rx="7" fill="url(#wireCo)" stroke="#8a5f1e" stroke-width="1"/>
  <!-- probes touching it -->
  <g><rect x="120" y="150" width="18" height="80" rx="8" fill="url(#probeK)"/><polygon points="129,230 123,230 129,258 135,230" fill="url(#tip)"/></g>
  <g><rect x="272" y="150" width="18" height="80" rx="8" fill="url(#probeR)"/><polygon points="281,230 275,230 281,258 287,230" fill="url(#tip)"/></g>
  <!-- sound waves + beep -->
  <g stroke="#2e8b57" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M300 300 A 26 26 0 0 1 300 340"/><path d="M316 292 A 42 42 0 0 1 316 348"/></g>
  <text x="205" y="330" text-anchor="middle" font-size="20" font-weight="800" fill="#2e8b57">¡PIII!</text>
  <text x="205" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">hay camino → suena (conduce)</text>

  <!-- ============ CORTADO → CALLA ============ -->
  <text x="605" y="102" text-anchor="middle" font-size="18" font-weight="800" fill="#b23a2e">CORTADO → CALLA</text>
  <!-- broken wire (gap) -->
  <rect x="520" y="252" width="70" height="14" rx="7" fill="url(#wireCo)" stroke="#8a5f1e" stroke-width="1"/>
  <rect x="620" y="252" width="70" height="14" rx="7" fill="url(#wireCo)" stroke="#8a5f1e" stroke-width="1"/>
  <path d="M592 246 L604 272 M604 246 L592 272" stroke="#b23a2e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- probes on the two broken ends -->
  <g><rect x="520" y="150" width="18" height="80" rx="8" fill="url(#probeK)"/><polygon points="529,230 523,230 529,258 535,230" fill="url(#tip)"/></g>
  <g><rect x="672" y="150" width="18" height="80" rx="8" fill="url(#probeR)"/><polygon points="681,230 675,230 681,258 687,230" fill="url(#tip)"/></g>
  <!-- silent -->
  <g stroke="#9aa0a6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"><path d="M700 306 A 22 22 0 0 1 700 340"/></g>
  <line x1="690" y1="300" x2="716" y2="346" stroke="#b23a2e" stroke-width="3" stroke-linecap="round"/>
  <text x="605" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">no hay camino → calla (cortado)</text>
</svg>
