<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.85"/><stop offset="0.4" stop-color="#ff6a52" stop-opacity="0.35"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowLow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.16"/><stop offset="0.5" stop-color="#ff6a52" stop-opacity="0.05"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="dome" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe89a"/><stop offset="0.6" stop-color="#ffd24d" stop-opacity="0.5"/><stop offset="1" stop-color="#ffd24d" stop-opacity="0"/></radialGradient>
    <radialGradient id="ldrHead" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#f3e2b0"/><stop offset="1" stop-color="#c9a94f"/></radialGradient>
    <linearGradient id="resB10" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e7d3ad"/><stop offset="0.5" stop-color="#d8bd8c"/><stop offset="1" stop-color="#bfa06b"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <line x1="410" y1="70" x2="410" y2="440" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="205" y="92" text-anchor="middle" font-size="18" font-weight="800" fill="#2b3330">Con luz encima</text>
  <text x="615" y="92" text-anchor="middle" font-size="18" font-weight="800" fill="#2b3330">A oscuras (tapada)</text>

  <!-- =============== LEFT: con luz =============== -->
  <g>
    <!-- circuit loop -->
    <g stroke="#26292e" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M110 250 H 142"/>            <!-- top-left to LDR -->
      <path d="M158 250 H 247"/>            <!-- LDR to LED -->
      <path d="M263 250 H 275 V 388 H 110 V 250"/>  <!-- LED to right, down, bottom, up left -->
    </g>
    <!-- sun over the LDR -->
    <circle cx="150" cy="160" r="42" fill="url(#sun)"/>
    <g stroke="#e6a92e" stroke-width="3.5" stroke-linecap="round"><line x1="150" y1="108" x2="150" y2="120"/><line x1="112" y1="130" x2="122" y2="140"/><line x1="188" y1="130" x2="178" y2="140"/></g>
    <g stroke="#f0c04a" stroke-width="3" stroke-linecap="round" opacity="0.85"><line x1="160" y1="192" x2="150" y2="214"/></g>
    <!-- LDR (legs solid + head) -->
    <line x1="142" y1="250" x2="142" y2="230" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/>
    <line x1="158" y1="250" x2="158" y2="230" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/>
    <g filter="url(#soft)"><circle cx="150" cy="210" r="24" fill="url(#ldrHead)" stroke="#a98950" stroke-width="2"/>
      <path d="M132 210 q5 -11 10 0 q5 11 10 0 q5 -11 10 0" fill="none" stroke="#8a6a2e" stroke-width="3"/></g>
    <text x="150" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#4E5852">LDR</text>
    <!-- LED bright (standing) -->
    <line x1="247" y1="250" x2="247" y2="230" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/>
    <line x1="263" y1="250" x2="263" y2="230" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="255" cy="204" r="52" fill="url(#glowB)"/>
    <g filter="url(#soft)"><ellipse cx="255" cy="210" rx="22" ry="8" fill="#d94636"/><path d="M233 210 Q233 176 255 172 Q277 176 277 210 Z" fill="url(#dome)"/>
      <ellipse cx="246" cy="190" rx="6" ry="10" fill="#ffd9d2" opacity="0.7"/></g>
    <!-- resistor on left wire -->
    <g filter="url(#soft)">
      <rect x="99" y="298" width="22" height="46" rx="11" fill="url(#resB10)" stroke="#a98950"/>
      <rect x="99" y="308" width="22" height="5" fill="#c0322a"/><rect x="99" y="316" width="22" height="5" fill="#c0322a"/><rect x="99" y="324" width="22" height="5" fill="#7a4a1e"/>
    </g>
    <!-- battery on bottom wire -->
    <rect x="182" y="380" width="18" height="16" fill="url(#panel)"/>
    <line x1="186" y1="376" x2="186" y2="400" stroke="#254a75" stroke-width="3" stroke-linecap="round"/>
    <line x1="197" y1="381" x2="197" y2="395" stroke="#254a75" stroke-width="8" stroke-linecap="round"/>
    <text x="212" y="393" font-size="12" font-weight="700" fill="#254a75">pila</text>
    <text x="192" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#2e8b57">poca resistencia → el LED brilla</text>
  </g>

  <!-- =============== RIGHT: a oscuras =============== -->
  <g>
    <g stroke="#26292e" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M520 250 H 552"/>
      <path d="M568 250 H 657"/>
      <path d="M673 250 H 685 V 388 H 520 V 250"/>
    </g>
    <!-- shadow over LDR -->
    <ellipse cx="560" cy="150" rx="60" ry="30" fill="#5a5348" opacity="0.22"/>
    <path d="M540 130 a15 15 0 1 0 12 22 a11 11 0 1 1 -12 -22 Z" fill="#b9c0c6"/>
    <!-- LDR dark -->
    <line x1="552" y1="250" x2="552" y2="230" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/>
    <line x1="568" y1="250" x2="568" y2="230" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/>
    <g filter="url(#soft)"><circle cx="560" cy="210" r="24" fill="#8f7c48" stroke="#6f5a2c" stroke-width="2"/>
      <path d="M542 210 q5 -11 10 0 q5 11 10 0 q5 -11 10 0" fill="none" stroke="#4c3d18" stroke-width="3"/></g>
    <text x="560" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#4E5852">LDR</text>
    <!-- LED dim -->
    <line x1="657" y1="250" x2="657" y2="230" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/>
    <line x1="673" y1="250" x2="673" y2="230" stroke="#9aa0a6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="665" cy="204" r="34" fill="url(#glowLow)"/>
    <g filter="url(#soft)"><ellipse cx="665" cy="210" rx="22" ry="8" fill="#a8382b"/><path d="M643 210 Q643 176 665 172 Q687 176 687 210 Z" fill="url(#dome)" opacity="0.8"/></g>
    <!-- resistor -->
    <g filter="url(#soft)">
      <rect x="509" y="298" width="22" height="46" rx="11" fill="url(#resB10)" stroke="#a98950"/>
      <rect x="509" y="308" width="22" height="5" fill="#c0322a"/><rect x="509" y="316" width="22" height="5" fill="#c0322a"/><rect x="509" y="324" width="22" height="5" fill="#7a4a1e"/>
    </g>
    <!-- battery -->
    <rect x="592" y="380" width="18" height="16" fill="url(#panel)"/>
    <line x1="596" y1="376" x2="596" y2="400" stroke="#254a75" stroke-width="3" stroke-linecap="round"/>
    <line x1="607" y1="381" x2="607" y2="395" stroke="#254a75" stroke-width="8" stroke-linecap="round"/>
    <text x="622" y="393" font-size="12" font-weight="700" fill="#254a75">pila</text>
    <text x="602" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#b23a2e">mucha resistencia → el LED se apaga</text>
  </g>
</svg>
