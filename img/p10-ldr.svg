<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.85"/><stop offset="0.4" stop-color="#ff6a52" stop-opacity="0.35"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowLow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.16"/><stop offset="0.5" stop-color="#ff6a52" stop-opacity="0.05"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="dome" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe89a"/><stop offset="0.6" stop-color="#ffd24d" stop-opacity="0.5"/><stop offset="1" stop-color="#ffd24d" stop-opacity="0"/></radialGradient>
    <radialGradient id="ldrHead" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#f3e2b0"/><stop offset="1" stop-color="#c9a94f"/></radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd3d6"/><stop offset="0.5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#c4c9cd"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <line x1="410" y1="70" x2="410" y2="430" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="205" y="96" text-anchor="middle" font-size="18" font-weight="800" fill="#2b3330">Con luz encima</text>
  <text x="615" y="96" text-anchor="middle" font-size="18" font-weight="800" fill="#2b3330">A oscuras (tapada)</text>

  <!-- helper: draw an LDR -->
  <!-- LEFT: lit -->
  <g>
    <circle cx="200" cy="150" r="70" fill="url(#sun)"/>
    <g stroke="#e6a92e" stroke-width="4" stroke-linecap="round">
      <line x1="200" y1="70" x2="200" y2="96"/><line x1="150" y1="100" x2="166" y2="118"/><line x1="250" y1="100" x2="234" y2="118"/>
    </g>
    <!-- LDR -->
    <g filter="url(#soft)" transform="translate(150,200)">
      <line x1="18" y1="60" x2="18" y2="96" stroke="url(#leg)" stroke-width="6"/>
      <line x1="52" y1="60" x2="52" y2="96" stroke="url(#leg)" stroke-width="6"/>
      <circle cx="35" cy="40" r="30" fill="url(#ldrHead)" stroke="#a98950" stroke-width="2"/>
      <path d="M12 40 q6 -12 11 0 q6 12 11 0 q6 -12 11 0" fill="none" stroke="#8a6a2e" stroke-width="3"/>
    </g>
    <!-- LED bright -->
    <circle cx="205" cy="360" r="66" fill="url(#glowB)"/>
    <g filter="url(#soft)"><ellipse cx="205" cy="360" rx="26" ry="9" fill="#d94636"/><path d="M180 360 Q180 322 205 318 Q230 322 230 360 Z" fill="url(#dome)"/>
      <ellipse cx="196" cy="338" rx="7" ry="11" fill="#ffd9d2" opacity="0.7"/></g>
    <text x="205" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#2e8b57">poca resistencia → LED brilla</text>
  </g>

  <!-- RIGHT: dark -->
  <g>
    <!-- hand shadow over LDR -->
    <ellipse cx="615" cy="150" rx="70" ry="34" fill="#5a5348" opacity="0.25"/>
    <g filter="url(#soft)" transform="translate(560,200)">
      <line x1="18" y1="60" x2="18" y2="96" stroke="url(#leg)" stroke-width="6"/>
      <line x1="52" y1="60" x2="52" y2="96" stroke="url(#leg)" stroke-width="6"/>
      <circle cx="35" cy="40" r="30" fill="#8f7c48" stroke="#6f5a2c" stroke-width="2"/>
      <path d="M12 40 q6 -12 11 0 q6 12 11 0 q6 -12 11 0" fill="none" stroke="#4c3d18" stroke-width="3"/>
    </g>
    <circle cx="615" cy="360" r="40" fill="url(#glowLow)"/>
    <g filter="url(#soft)"><ellipse cx="615" cy="360" rx="26" ry="9" fill="#a8382b"/><path d="M590 360 Q590 322 615 318 Q640 322 640 360 Z" fill="url(#dome)" opacity="0.85"/></g>
    <text x="615" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#b23a2e">mucha resistencia → LED se apaga</text>
  </g>
</svg>
