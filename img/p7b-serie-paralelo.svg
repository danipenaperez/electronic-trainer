<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panelSP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="ledOn" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <radialGradient id="ledDim" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#f0b3ac"/><stop offset="0.5" stop-color="#d9736a"/><stop offset="1" stop-color="#a9463d"/></radialGradient>
    <radialGradient id="glowOn" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.7"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowDim" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.28"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <marker id="flowSP" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#B0562A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panelSP)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="410" y1="70" x2="410" y2="430" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- ================= EN SERIE ================= -->
  <text x="215" y="104" text-anchor="middle" font-size="19" font-weight="800" fill="#1B2320">EN SERIE</text>

  <!-- loop -->
  <rect x="130" y="150" width="170" height="175" rx="16" fill="none" stroke="#6b7280" stroke-width="6"/>
  <!-- flow arrows -->
  <g stroke="#B0562A" stroke-width="4" fill="none" stroke-linecap="round"><path d="M130 250 v-1" marker-end="url(#flowSP)"/><path d="M255 150 h1" marker-end="url(#flowSP)"/></g>
  <!-- battery symbol on bottom wire -->
  <g stroke="#254a75" stroke-linecap="round">
    <line x1="205" y1="309" x2="205" y2="341" stroke-width="3"/>
    <line x1="222" y1="316" x2="222" y2="334" stroke-width="7"/>
  </g>
  <text x="214" y="360" text-anchor="middle" font-size="11.5" fill="#254a75">pila</text>
  <!-- two LEDs (dim) on top wire -->
  <g><circle cx="184" cy="150" r="34" fill="url(#glowDim)"/><circle cx="184" cy="150" r="14" fill="url(#ledDim)" stroke="#8c3a32" stroke-width="1.5"/></g>
  <g><circle cx="246" cy="150" r="34" fill="url(#glowDim)"/><circle cx="246" cy="150" r="14" fill="url(#ledDim)" stroke="#8c3a32" stroke-width="1.5"/></g>

  <!-- caption -->
  <text x="215" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#4E5852">Un solo camino</text>
  <text x="215" y="412" text-anchor="middle" font-size="12.5" fill="#4E5852">la corriente pasa por los dos LEDs</text>
  <text x="215" y="430" text-anchor="middle" font-size="12.5" fill="#4E5852">si cae uno, caen los dos · brillan menos</text>

  <!-- ================= EN PARALELO ================= -->
  <text x="605" y="104" text-anchor="middle" font-size="19" font-weight="800" fill="#1B2320">EN PARALELO</text>

  <!-- two bus lines -->
  <g stroke="#6b7280" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="500" y1="150" x2="500" y2="325"/>
    <line x1="710" y1="150" x2="710" y2="325"/>
    <!-- battery link at bottom -->
    <path d="M500 325 H 710"/>
    <!-- two branches -->
    <line x1="500" y1="178" x2="710" y2="178"/>
    <line x1="500" y1="250" x2="710" y2="250"/>
  </g>
  <!-- flow arrows into the two branches -->
  <g stroke="#B0562A" stroke-width="4" fill="none" stroke-linecap="round"><path d="M560 178 h1" marker-end="url(#flowSP)"/><path d="M560 250 h1" marker-end="url(#flowSP)"/></g>
  <!-- battery symbol on bottom link -->
  <g stroke="#254a75" stroke-linecap="round">
    <line x1="597" y1="309" x2="597" y2="341" stroke-width="3"/>
    <line x1="614" y1="316" x2="614" y2="334" stroke-width="7"/>
  </g>
  <text x="606" y="360" text-anchor="middle" font-size="11.5" fill="#254a75">pila</text>
  <!-- two LEDs (bright) -->
  <g><circle cx="605" cy="178" r="34" fill="url(#glowOn)"/><circle cx="605" cy="178" r="14" fill="url(#ledOn)" stroke="#8c3a32" stroke-width="1.5"/></g>
  <g><circle cx="605" cy="250" r="34" fill="url(#glowOn)"/><circle cx="605" cy="250" r="14" fill="url(#ledOn)" stroke="#8c3a32" stroke-width="1.5"/></g>

  <!-- caption -->
  <text x="605" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#4E5852">Dos caminos independientes</text>
  <text x="605" y="412" text-anchor="middle" font-size="12.5" fill="#4E5852">cada LED recibe todo el voltaje (brillan igual)</text>
  <text x="605" y="430" text-anchor="middle" font-size="12.5" fill="#4E5852">uno no depende del otro</text>
</svg>
