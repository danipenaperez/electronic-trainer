<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="battBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#254a75"/></linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f2ee"/><stop offset="0.5" stop-color="#c9cbc4"/><stop offset="1" stop-color="#9a9c94"/></linearGradient>
    <radialGradient id="motor" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#d7dade"/><stop offset="1" stop-color="#8a9096"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <text x="410" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#8a7c5c">más pilas en serie = más voltaje = más fuerza</text>

  <!-- three columns: 1 cell, 2 cells, 3 cells -->
  <!-- col1 -->
  <g transform="translate(60,110)">
    <g filter="url(#soft)"><rect x="0" y="120" width="200" height="46" rx="10" fill="url(#battBody)"/>
      <rect x="12" y="130" width="176" height="26" rx="7" fill="url(#cell)" stroke="#7d7f78"/></g>
    <rect x="90" y="90" width="60" height="60" rx="30" fill="url(#panel)"/>
    <g filter="url(#soft)"><circle cx="120" cy="60" r="40" fill="url(#motor)" stroke="#7c8288" stroke-width="2"/>
      <circle cx="120" cy="60" r="8" fill="#5a6066"/></g>
    <!-- slow: 2 short motion lines -->
    <path d="M120 14 a46 46 0 0 1 26 10" fill="none" stroke="#b9c0c6" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <rect x="60" y="196" width="120" height="34" rx="17" fill="#fff" stroke="#d8d0be"/>
    <text x="120" y="219" text-anchor="middle" font-size="16" font-weight="700" fill="#254a75">1,5 V</text>
    <text x="120" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6b5f">gira lento</text>
  </g>

  <!-- col2 -->
  <g transform="translate(310,110)">
    <g filter="url(#soft)"><rect x="0" y="120" width="200" height="60" rx="10" fill="url(#battBody)"/>
      <rect x="12" y="128" width="176" height="20" rx="6" fill="url(#cell)" stroke="#7d7f78"/>
      <rect x="12" y="152" width="176" height="20" rx="6" fill="url(#cell)" stroke="#7d7f78"/></g>
    <g filter="url(#soft)"><circle cx="120" cy="60" r="40" fill="url(#motor)" stroke="#7c8288" stroke-width="2"/>
      <circle cx="120" cy="60" r="8" fill="#5a6066"/></g>
    <path d="M120 12 a48 48 0 0 1 34 16" fill="none" stroke="#b9c0c6" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M120 108 a48 48 0 0 1 -34 -16" fill="none" stroke="#b9c0c6" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <rect x="60" y="210" width="120" height="34" rx="17" fill="#fff" stroke="#d8d0be"/>
    <text x="120" y="233" text-anchor="middle" font-size="16" font-weight="700" fill="#254a75">3 V</text>
    <text x="120" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6b5f">gira rápido</text>
  </g>

  <!-- col3 -->
  <g transform="translate(560,110)">
    <g filter="url(#soft)"><rect x="0" y="120" width="200" height="76" rx="10" fill="url(#battBody)"/>
      <rect x="12" y="127" width="176" height="16" rx="5" fill="url(#cell)" stroke="#7d7f78"/>
      <rect x="12" y="147" width="176" height="16" rx="5" fill="url(#cell)" stroke="#7d7f78"/>
      <rect x="12" y="167" width="176" height="16" rx="5" fill="url(#cell)" stroke="#7d7f78"/></g>
    <g filter="url(#soft)"><circle cx="120" cy="60" r="40" fill="url(#motor)" stroke="#7c8288" stroke-width="2"/>
      <circle cx="120" cy="60" r="8" fill="#5a6066"/></g>
    <path d="M120 8 a52 52 0 0 1 44 24" fill="none" stroke="#a9b1b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 112 a52 52 0 0 1 -44 -24" fill="none" stroke="#a9b1b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M74 44 a52 52 0 0 1 12 -30" fill="none" stroke="#a9b1b8" stroke-width="4" stroke-linecap="round"/>
    <rect x="55" y="226" width="130" height="34" rx="17" fill="#fff" stroke="#d8d0be"/>
    <text x="120" y="249" text-anchor="middle" font-size="16" font-weight="700" fill="#254a75">4,5 V</text>
    <text x="120" y="286" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6b5f">gira más rápido</text>
  </g>
</svg>
