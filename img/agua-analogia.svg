<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panelW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="pumpBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#254a75"/></linearGradient>
    <linearGradient id="waterFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc2da"/><stop offset="1" stop-color="#3f9ab8"/></linearGradient>
    <filter id="softW" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.16"/></filter>
    <marker id="flow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#B0562A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="hArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#0E6274" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panelW)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <!-- ===== PIPE LOOP (circuito) ===== -->
  <path id="loop" d="M 325 378 H 250 A 44 44 0 0 1 206 334 V 210 A 44 44 0 0 1 250 166 H 630 A 44 44 0 0 1 674 210 V 334 A 44 44 0 0 1 630 378 H 495"
        fill="none" stroke="#2b6274" stroke-width="30" stroke-linecap="round"/>
  <path d="M 325 378 H 250 A 44 44 0 0 1 206 334 V 210 A 44 44 0 0 1 250 166 H 630 A 44 44 0 0 1 674 210 V 334 A 44 44 0 0 1 630 378 H 495"
        fill="none" stroke="url(#waterFill)" stroke-width="17" stroke-linecap="round"/>

  <!-- flow arrows (corriente) clockwise along the top -->
  <g stroke="#B0562A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 166 h1" marker-end="url(#flow)"/>
    <path d="M560 166 h1" marker-end="url(#flow)"/>
    <path d="M206 300 v-1" marker-end="url(#flow)"/>
  </g>

  <!-- ===== RESISTANCE: pinch on the top pipe ===== -->
  <g>
    <path d="M420 151 L462 151 L446 166 Z" fill="#9E7115"/>
    <path d="M420 181 L462 181 L446 166 Z" fill="#9E7115"/>
    <circle cx="441" cy="166" r="4" fill="#f3efe6"/>
  </g>

  <!-- ===== PADDLE WHEEL (el LED, donde trabaja la corriente) ===== -->
  <g filter="url(#softW)" transform="translate(674,268)">
    <circle r="30" fill="#f7f4ec" stroke="#853B6E" stroke-width="3"/>
    <g stroke="#853B6E" stroke-width="4" stroke-linecap="round">
      <path d="M0 -24 V24"/><path d="M-24 0 H24"/>
      <path d="M-17 -17 L17 17"/><path d="M-17 17 L17 -17"/>
    </g>
    <circle r="6" fill="#853B6E"/>
  </g>

  <!-- ===== PUMP / TANK (voltaje = presión) ===== -->
  <g filter="url(#softW)">
    <rect x="325" y="356" width="170" height="74" rx="12" fill="url(#pumpBody)"/>
    <rect x="339" y="368" width="142" height="20" rx="6" fill="#eef0ec"/>
    <rect x="339" y="394" width="142" height="20" rx="6" fill="#eef0ec"/>
    <text x="410" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#254a75">LA BOMBA (la pila)</text>
  </g>

  <!-- ===== LABELS ===== -->
  <!-- Voltaje / presión (blue): etiqueta centrada sobre la bomba -->
  <g>
    <text x="410" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#0E6274">VOLTAJE</text>
    <text x="410" y="317" text-anchor="middle" font-size="12.5" fill="#0E6274">la presión con que la bomba empuja</text>
    <path d="M410 348 L410 326" fill="none" stroke="#0E6274" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#hArrow)"/>
  </g>

  <!-- Corriente / caudal (copper) -->
  <g>
    <text x="300" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#B0562A">CORRIENTE</text>
    <text x="300" y="137" text-anchor="middle" font-size="12.5" fill="#B0562A">el agua que fluye (caudal)</text>
  </g>

  <!-- Resistencia / estrechamiento (gold) -->
  <g>
    <path d="M441 205 L441 188" fill="none" stroke="#9E7115" stroke-width="2" stroke-dasharray="2 5"/>
    <text x="470" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#9E7115">RESISTENCIA</text>
    <text x="470" y="247" text-anchor="middle" font-size="12.5" fill="#9E7115">tubería estrecha: pasa menos</text>
  </g>

  <!-- LED note near paddle wheel -->
  <text x="636" y="262" text-anchor="end" font-size="13" font-weight="700" fill="#853B6E">el LED</text>
  <text x="636" y="279" text-anchor="end" font-size="12.5" fill="#853B6E">trabaja aquí</text>

  <!-- Circuito (plum) bottom caption -->
  <g>
    <text x="410" y="466" text-anchor="middle" font-size="14.5" font-weight="700" fill="#853B6E">TODO EL ANILLO CERRADO = CIRCUITO</text>
    <text x="410" y="485" text-anchor="middle" font-size="12.5" fill="#7B857D">si lo cortas por cualquier sitio, el agua (la corriente) se para</text>
  </g>
</svg>
