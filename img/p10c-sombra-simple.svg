<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panelSo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="sunSo" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#e6a72a"/></radialGradient>
    <radialGradient id="ledBrSo" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <radialGradient id="ledDimSo" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#efbcb5"/><stop offset="0.5" stop-color="#cf8078"/><stop offset="1" stop-color="#9c534b"/></radialGradient>
    <radialGradient id="glowSo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.7"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowSoD" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.22"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panelSo)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="410" y1="70" x2="410" y2="420" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="410" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#9E7115">TU SOMBRA TAPA LA LUZ Y EL LED BAJA · SUÉLTALA Y SUBE</text>

  <!-- ============ SIN SOMBRA ============ -->
  <text x="205" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">SIN SOMBRA</text>
  <g><circle cx="130" cy="150" r="22" fill="url(#sunSo)"/><g stroke="#e6a72a" stroke-width="3" stroke-linecap="round"><line x1="130" y1="116" x2="130" y2="124"/><line x1="98" y1="150" x2="106" y2="150"/></g></g>
  <g stroke="#f0c04a" stroke-width="3" stroke-linecap="round" opacity="0.9"><line x1="148" y1="166" x2="196" y2="204"/><line x1="158" y1="156" x2="200" y2="192"/></g>
  <g><rect x="180" y="196" width="56" height="42" rx="11" fill="#e9e6dd" stroke="#9aa0a6" stroke-width="2"/><path d="M190 217 q6 -11 12 0 q6 11 12 0" fill="none" stroke="#9E7115" stroke-width="3"/><text x="208" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4E5852">LDR</text></g>
  <g><circle cx="205" cy="330" r="30" fill="url(#glowSo)"/><circle cx="205" cy="330" r="15" fill="url(#ledBrSo)" stroke="#8c3a32" stroke-width="1.5"/></g>
  <text x="205" y="390" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">el LED brilla</text>

  <!-- ============ CON TU SOMBRA ============ -->
  <text x="605" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">CON TU SOMBRA</text>
  <!-- sun (blocked) -->
  <g opacity="0.6"><circle cx="700" cy="140" r="20" fill="url(#sunSo)"/></g>
  <!-- hand silhouette above the LDR -->
  <g fill="#4E5852">
    <path d="M556 150 h58 v-16 a5 5 0 0 1 10 0 v16 h8 v-22 a5 5 0 0 1 10 0 v22 h8 v-18 a5 5 0 0 1 10 0 v18 h8 v-12 a5 5 0 0 1 10 0 v12 c14 4 16 22 6 34 l-64 6 c-40 -6 -46 -46 -78 -50 a7 7 0 0 1 0 -14 Z"/>
  </g>
  <!-- shadow cone onto LDR -->
  <path d="M574 190 L636 190 L620 260 L590 260 Z" fill="#4E5852" opacity="0.16"/>
  <!-- LDR in shadow -->
  <g><rect x="580" y="230" width="56" height="42" rx="11" fill="#c9c5bb" stroke="#9aa0a6" stroke-width="2"/><path d="M590 251 q6 -11 12 0 q6 11 12 0" fill="none" stroke="#7a5a12" stroke-width="3"/><text x="608" y="290" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4E5852">LDR</text></g>
  <!-- LED dim -->
  <g><circle cx="605" cy="356" r="18" fill="url(#glowSoD)"/><circle cx="605" cy="356" r="15" fill="url(#ledDimSo)" stroke="#8c3a32" stroke-width="1.5"/></g>
  <text x="605" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">el LED baja</text>
</svg>
