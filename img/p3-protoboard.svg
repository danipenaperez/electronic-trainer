<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="bb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf6"/><stop offset="1" stop-color="#ece9df"/></linearGradient>
    <radialGradient id="ledGlow3" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.75"/><stop offset="0.45" stop-color="#ff6a52" stop-opacity="0.28"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="ledDome3" cx="0.38" cy="0.30" r="0.8"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <linearGradient id="resBody3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7d3ad"/><stop offset="0.5" stop-color="#d8bd8c"/><stop offset="1" stop-color="#bfa06b"/></linearGradient>
    <linearGradient id="leg3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd3d6"/><stop offset="0.5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#c4c9cd"/></linearGradient>
    <linearGradient id="battBody3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#254a75"/></linearGradient>
    <linearGradient id="cell3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f2ee"/><stop offset="0.5" stop-color="#c9cbc4"/><stop offset="1" stop-color="#9a9c94"/></linearGradient>
    <linearGradient id="wireR3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6564a"/><stop offset="1" stop-color="#c0322a"/></linearGradient>
    <linearGradient id="wireK3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f45"/><stop offset="1" stop-color="#1c1f24"/></linearGradient>
    <pattern id="holes" width="22" height="22" patternUnits="userSpaceOnUse"><rect x="7" y="7" width="8" height="8" rx="2" fill="#cbc7ba"/><rect x="7.5" y="7.5" width="5" height="5" rx="1.5" fill="#8f8b7e"/></pattern>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel3)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <!-- legend -->
  <g>
    <circle cx="258" cy="46" r="8" fill="none" stroke="#5f6b5f" stroke-width="2.2"/><circle cx="258" cy="46" r="3.4" fill="#2b2f34"/>
    <text x="274" y="51" font-size="13.5" fill="#5f6b5f">= el agujero donde se pincha cada cable o pata</text>
  </g>

  <!-- ===== BREADBOARD ===== -->
  <g filter="url(#soft3)">
    <rect x="70" y="70" width="680" height="330" rx="14" fill="url(#bb)" stroke="#d8d4c6" stroke-width="2"/>
    <!-- top power rails (+ and -) -->
    <line x1="96" y1="96" x2="724" y2="96" stroke="#d64b3f" stroke-width="3"/>
    <text x="82" y="101" font-size="15" font-weight="700" fill="#d64b3f">＋</text>
    <rect x="110" y="104" width="600" height="20" fill="url(#holes)"/>
    <line x1="96" y1="150" x2="724" y2="150" stroke="#3f74b0" stroke-width="3"/>
    <text x="82" y="156" font-size="17" font-weight="700" fill="#3f74b0">−</text>
    <rect x="110" y="152" width="600" height="18" fill="url(#holes)"/>
    <!-- main upper block -->
    <rect x="110" y="176" width="600" height="66" fill="url(#holes)"/>
    <!-- center trench -->
    <rect x="70" y="246" width="680" height="14" fill="#e2ddcf"/>
    <line x1="70" y1="253" x2="750" y2="253" stroke="#cfcabb" stroke-width="1"/>
    <!-- main lower block -->
    <rect x="110" y="262" width="600" height="66" fill="url(#holes)"/>
    <!-- bottom power rails -->
    <line x1="96" y1="356" x2="724" y2="356" stroke="#d64b3f" stroke-width="3"/>
    <rect x="110" y="360" width="600" height="20" fill="url(#holes)"/>
    <line x1="96" y1="384" x2="724" y2="384" stroke="#3f74b0" stroke-width="3"/>
  </g>

  <!-- ===== SHARED COLUMN highlight (col 425: resistencia + pata larga) ===== -->
  <rect x="414" y="176" width="22" height="66" rx="9" fill="#9E7115" opacity="0.16"/>
  <rect x="414" y="176" width="22" height="66" rx="9" fill="none" stroke="#9E7115" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.8"/>

  <!-- ===== WIRES ===== -->
  <!-- red battery wire: + rail to battery -->
  <path d="M689 114 C 762 134, 762 300, 700 330" fill="none" stroke="url(#wireR3)" stroke-width="10" stroke-linecap="round"/>
  <!-- black battery wire: - rail to battery -->
  <path d="M150 159 C 92 210, 92 380, 200 410 C 360 448, 520 446, 640 408" fill="none" stroke="url(#wireK3)" stroke-width="10" stroke-linecap="round"/>
  <!-- red jumper: + rail down to resistor-left column (337) -->
  <path d="M337 114 L337 183" fill="none" stroke="url(#wireR3)" stroke-width="8" stroke-linecap="round"/>
  <!-- black jumper: - rail down to LED-cathode column (447) -->
  <path d="M447 159 L447 205" fill="none" stroke="url(#wireK3)" stroke-width="8" stroke-linecap="round"/>

  <!-- ===== RESISTOR (horizontal): legs into 2 holes col 337 and col 425, row 205 ===== -->
  <g filter="url(#soft3)">
    <line x1="337" y1="205" x2="425" y2="205" stroke="url(#leg3)" stroke-width="4"/>
    <rect x="352" y="190" width="58" height="30" rx="15" fill="url(#resBody3)" stroke="#a98950" stroke-width="1"/>
    <rect x="362" y="190" width="7" height="30" fill="#c0322a"/>
    <rect x="374" y="190" width="7" height="30" fill="#c0322a"/>
    <rect x="386" y="190" width="7" height="30" fill="#7a4a1e"/>
    <rect x="400" y="190" width="6" height="30" fill="#d4af37"/>
  </g>

  <!-- ===== LED (vertical, standing): legs into col 425 (anode, long) and col 447 (cathode) row 227 ===== -->
  <circle cx="436" cy="190" r="66" fill="url(#ledGlow3)"/>
  <!-- legs -->
  <path d="M425 227 L425 196" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>
  <path d="M447 227 L447 200" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>
  <!-- dome standing up -->
  <g filter="url(#soft3)">
    <ellipse cx="436" cy="196" rx="26" ry="9" fill="#d94636"/>
    <path d="M411 196 Q411 150 436 145 Q461 150 461 196 Z" fill="url(#ledDome3)"/>
    <ellipse cx="427" cy="172" rx="7" ry="11" fill="#ffd9d2" opacity="0.7"/>
  </g>

  <!-- ===== BATTERY ===== -->
  <g filter="url(#soft3)">
    <rect x="595" y="330" width="150" height="72" rx="11" fill="url(#battBody3)"/>
    <rect x="609" y="340" width="122" height="22" rx="7" fill="url(#cell3)" stroke="#7d7f78" stroke-width="1"/>
    <rect x="609" y="368" width="122" height="22" rx="7" fill="url(#cell3)" stroke="#7d7f78" stroke-width="1"/>
    <text x="635" y="356" font-size="13" font-weight="700" fill="#5f6158">＋  −</text>
  </g>

  <!-- ===== PLUG MARKERS ===== -->
  <g>
    <!-- red: + rail plugs -->
    <circle cx="689" cy="114" r="8.5" fill="none" stroke="#c0322a" stroke-width="2.6"/><circle cx="689" cy="114" r="3.6" fill="#2b2f34"/>
    <circle cx="337" cy="114" r="8.5" fill="none" stroke="#c0322a" stroke-width="2.6"/><circle cx="337" cy="114" r="3.6" fill="#2b2f34"/>
    <!-- blue: - rail plugs -->
    <circle cx="150" cy="159" r="8.5" fill="none" stroke="#3f74b0" stroke-width="2.6"/><circle cx="150" cy="159" r="3.6" fill="#2b2f34"/>
    <circle cx="447" cy="159" r="8.5" fill="none" stroke="#3f74b0" stroke-width="2.6"/><circle cx="447" cy="159" r="3.6" fill="#2b2f34"/>
    <!-- gold: RESISTOR's 2 holes -->
    <circle cx="337" cy="205" r="9" fill="none" stroke="#9E7115" stroke-width="3"/><circle cx="337" cy="205" r="3.6" fill="#2b2f34"/>
    <circle cx="425" cy="205" r="9" fill="none" stroke="#9E7115" stroke-width="3"/><circle cx="425" cy="205" r="3.6" fill="#2b2f34"/>
    <!-- LED's 2 holes -->
    <circle cx="425" cy="227" r="9" fill="none" stroke="#c0322a" stroke-width="3"/><circle cx="425" cy="227" r="3.6" fill="#2b2f34"/>
    <circle cx="447" cy="227" r="9" fill="none" stroke="#3f74b0" stroke-width="3"/><circle cx="447" cy="227" r="3.6" fill="#2b2f34"/>
  </g>

  <!-- ===== LEG LABELS ===== -->
  <g>
    <text x="392" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c0322a">pata LARGA (+)</text>
    <path d="M405 282 C 415 260, 420 245, 425 234" fill="none" stroke="#c0322a" stroke-width="1.6" stroke-dasharray="3 4"/>
    <text x="512" y="252" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3f74b0">pata CORTA (−)</text>
    <path d="M478 248 C 465 242, 455 236, 448 232" fill="none" stroke="#3f74b0" stroke-width="1.6" stroke-dasharray="3 4"/>
  </g>

  <!-- caption -->
  <text x="410" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#9E7115">La resistencia y la pata larga, en la MISMA columna (vertical) → conectadas</text>
</svg>
