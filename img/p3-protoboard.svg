<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="bb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf6"/><stop offset="1" stop-color="#ece9df"/></linearGradient>
    <radialGradient id="ledGlow3" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.8"/><stop offset="0.45" stop-color="#ff6a52" stop-opacity="0.3"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <radialGradient id="ledDome3" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <linearGradient id="resBody3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7d3ad"/><stop offset="0.5" stop-color="#d8bd8c"/><stop offset="1" stop-color="#bfa06b"/></linearGradient>
    <linearGradient id="leg3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfd3d6"/><stop offset="0.5" stop-color="#9aa0a6"/><stop offset="1" stop-color="#c4c9cd"/></linearGradient>
    <linearGradient id="battBody3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#254a75"/></linearGradient>
    <linearGradient id="cell3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f2ee"/><stop offset="0.5" stop-color="#c9cbc4"/><stop offset="1" stop-color="#9a9c94"/></linearGradient>
    <linearGradient id="wireR3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6564a"/><stop offset="1" stop-color="#c0322a"/></linearGradient>
    <linearGradient id="wireK3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f45"/><stop offset="1" stop-color="#1c1f24"/></linearGradient>
    <pattern id="holes" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="8" height="8" rx="2" fill="#cbc7ba"/>
      <rect x="7.5" y="7.5" width="5" height="5" rx="1.5" fill="#8f8b7e"/>
    </pattern>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel3)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <!-- ===== BREADBOARD ===== -->
  <g filter="url(#soft3)">
    <rect x="70" y="70" width="680" height="330" rx="14" fill="url(#bb)" stroke="#d8d4c6" stroke-width="2"/>

    <!-- top power rails -->
    <line x1="96" y1="96" x2="724" y2="96" stroke="#d64b3f" stroke-width="3"/>
    <line x1="96" y1="150" x2="724" y2="150" stroke="#3f74b0" stroke-width="3"/>
    <text x="82" y="101" font-size="15" font-weight="700" fill="#d64b3f">＋</text>
    <text x="82" y="156" font-size="17" font-weight="700" fill="#3f74b0">−</text>
    <rect x="110" y="104" width="600" height="22" fill="url(#holes)"/>
    <rect x="110" y="120" width="600" height="0" fill="none"/>

    <!-- main upper block -->
    <rect x="110" y="176" width="600" height="66" fill="url(#holes)"/>
    <!-- center trench -->
    <rect x="70" y="246" width="680" height="14" fill="#e2ddcf"/>
    <line x1="70" y1="253" x2="750" y2="253" stroke="#cfcabb" stroke-width="1"/>
    <!-- main lower block -->
    <rect x="110" y="262" width="600" height="66" fill="url(#holes)"/>

    <!-- bottom power rails -->
    <line x1="96" y1="356" x2="724" y2="356" stroke="#d64b3f" stroke-width="3"/>
    <line x1="96" y1="378" x2="724" y2="378" stroke="#3f74b0" stroke-width="3"/>
    <rect x="110" y="360" width="600" height="22" fill="url(#holes)"/>
  </g>

  <!-- ===== JUMPER WIRES to battery ===== -->
  <!-- red: top + rail to battery + -->
  <path d="M150 96 C 120 40, 700 24, 690 96" fill="none" stroke="url(#wireR3)" stroke-width="9" stroke-linecap="round" opacity="0"/>
  <path d="M690 105 C 760 130, 760 300, 700 330" fill="none" stroke="url(#wireR3)" stroke-width="10" stroke-linecap="round"/>
  <!-- black: bottom - rail to battery - -->
  <path d="M150 150 C 80 205, 80 365, 180 405 C 335 442, 510 440, 645 406" fill="none" stroke="url(#wireK3)" stroke-width="10" stroke-linecap="round"/>

  <!-- short wire from + rail into resistor column -->
  <path d="M240 96 C 250 130, 265 150, 300 190" fill="none" stroke="url(#wireR3)" stroke-width="8" stroke-linecap="round"/>
  <!-- short wire from LED cathode column to - rail -->
  <path d="M470 300 C 470 330, 300 356, 240 356" fill="none" stroke="url(#wireK3)" stroke-width="8" stroke-linecap="round"/>

  <!-- ===== RESISTOR plugged flat (spans from col ~300 to LED anode col ~430) ===== -->
  <g filter="url(#soft3)">
    <line x1="300" y1="192" x2="300" y2="212" stroke="url(#leg3)" stroke-width="4"/>
    <line x1="300" y1="200" x2="432" y2="200" stroke="url(#leg3)" stroke-width="4"/>
    <line x1="432" y1="200" x2="432" y2="234" stroke="url(#leg3)" stroke-width="4"/>
    <rect x="322" y="184" width="88" height="30" rx="15" fill="url(#resBody3)" stroke="#a98950" stroke-width="1"/>
    <rect x="336" y="184" width="8" height="30" fill="#c0322a"/>
    <rect x="350" y="184" width="8" height="30" fill="#c0322a"/>
    <rect x="364" y="184" width="8" height="30" fill="#7a4a1e"/>
    <rect x="390" y="184" width="7" height="30" fill="#d4af37"/>
  </g>

  <!-- ===== LED plugged across the trench (lit) ===== -->
  <!-- anode leg in upper block col 432, cathode leg in lower block col 470 -->
  <circle cx="452" cy="235" r="70" fill="url(#ledGlow3)"/>
  <path d="M432 234 L432 210" stroke="url(#leg3)" stroke-width="5" stroke-linecap="round"/>
  <path d="M470 262 L470 238" stroke="url(#leg3)" stroke-width="5" stroke-linecap="round"/>
  <g filter="url(#soft3)">
    <ellipse cx="452" cy="222" rx="26" ry="9" fill="#d94636"/>
    <path d="M427 222 Q427 184 452 180 Q477 184 477 222 Z" fill="url(#ledDome3)"/>
    <ellipse cx="443" cy="200" rx="7" ry="11" fill="#ffd9d2" opacity="0.7"/>
  </g>

  <!-- ===== LED leg polarity + insertion markers ===== -->
  <g>
    <!-- insertion rings where the legs enter the holes -->
    <circle cx="432" cy="214" r="8" fill="none" stroke="#c0322a" stroke-width="2.5"/>
    <circle cx="470" cy="257" r="8" fill="none" stroke="#3f74b0" stroke-width="2.5"/>
    <!-- long leg (+) label -->
    <text x="372" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#c0322a">pata LARGA (+)</text>
    <path d="M372 158 C 400 180, 420 195, 432 208" fill="none" stroke="#c0322a" stroke-width="1.6" stroke-dasharray="3 4"/>
    <!-- short leg (−) label -->
    <text x="540" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#3f74b0">pata CORTA (−)</text>
    <path d="M505 292 C 490 278, 478 268, 470 262" fill="none" stroke="#3f74b0" stroke-width="1.6" stroke-dasharray="3 4"/>
  </g>

  <!-- ===== BATTERY pack bottom-right ===== -->
  <g filter="url(#soft3)">
    <rect x="600" y="330" width="150" height="72" rx="11" fill="url(#battBody3)"/>
    <rect x="614" y="340" width="122" height="22" rx="7" fill="url(#cell3)" stroke="#7d7f78" stroke-width="1"/>
    <rect x="614" y="368" width="122" height="22" rx="7" fill="url(#cell3)" stroke="#7d7f78" stroke-width="1"/>
    <text x="640" y="356" font-size="13" font-weight="700" fill="#5f6158">＋  −</text>
  </g>
</svg>
