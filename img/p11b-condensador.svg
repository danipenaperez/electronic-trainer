<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panelC2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="bucket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f5ef"/><stop offset="1" stop-color="#e7e3d7"/></linearGradient>
    <linearGradient id="waterC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc2da"/><stop offset="1" stop-color="#3f9ab8"/></linearGradient>
    <radialGradient id="ledFade" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ffb3a8"/><stop offset="0.5" stop-color="#e8695e"/><stop offset="1" stop-color="#b0463d"/></radialGradient>
    <radialGradient id="glowF" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.4"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <marker id="arrC" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#0E6274" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panelC2)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="410" y1="70" x2="410" y2="430" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- ============ SE LLENA ============ -->
  <text x="205" y="102" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">SE LLENA (con la pila)</text>
  <!-- battery symbol -->
  <g stroke="#254a75" stroke-linecap="round"><line x1="150" y1="140" x2="150" y2="168" stroke-width="3"/><line x1="166" y1="147" x2="166" y2="161" stroke-width="7"/></g>
  <text x="128" y="158" text-anchor="end" font-size="12" fill="#254a75">pila</text>
  <!-- wire pila -> cubo -->
  <path d="M158 168 C 158 195, 205 190, 205 205" fill="none" stroke="#6b7280" stroke-width="5"/>
  <!-- cubo (condensador) casi lleno -->
  <path d="M165 208 L245 208 L236 330 L174 330 Z" fill="url(#bucket)" stroke="#c9c4b5" stroke-width="2"/>
  <path d="M171 250 L239 250 L236 330 L174 330 Z" fill="url(#waterC)"/>
  <path d="M171 250 q9 -8 17 0 q9 8 17 0 q9 -8 17 0 q9 8 17 0" fill="none" stroke="#8fd0e2" stroke-width="2"/>
  <!-- plates icon -->
  <g stroke="#853B6E" stroke-width="3" stroke-linecap="round"><line x1="196" y1="196" x2="214" y2="196"/><line x1="199" y1="204" x2="211" y2="204"/></g>
  <!-- arrow: entra carga -->
  <path d="M280 300 L280 240" fill="none" stroke="#0E6274" stroke-width="2.5" stroke-dasharray="2 5" marker-end="url(#arrC)"/>
  <text x="292" y="278" font-size="12.5" fill="#0E6274">entra y se</text>
  <text x="292" y="295" font-size="12.5" fill="#0E6274">guarda carga</text>
  <text x="205" y="372" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">Guarda electricidad,</text>
  <text x="205" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">como un cubo de agua</text>

  <!-- ============ SE VACÍA ============ -->
  <text x="605" y="102" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">SE VACÍA (por el LED)</text>
  <!-- cubo medio vacío -->
  <path d="M540 168 L620 168 L611 290 L549 290 Z" fill="url(#bucket)" stroke="#c9c4b5" stroke-width="2"/>
  <path d="M553 240 L607 240 L611 290 L549 290 Z" fill="url(#waterC)"/>
  <path d="M553 240 q7 -7 14 0 q7 7 14 0 q7 -7 14 0" fill="none" stroke="#8fd0e2" stroke-width="2"/>
  <g stroke="#853B6E" stroke-width="3" stroke-linecap="round"><line x1="571" y1="156" x2="589" y2="156"/><line x1="574" y1="164" x2="586" y2="164"/></g>
  <!-- pipe from bucket bottom to LED -->
  <path d="M580 290 C 580 320, 640 320, 665 320" fill="none" stroke="#6b7280" stroke-width="5"/>
  <!-- LED fading -->
  <g><circle cx="690" cy="320" r="26" fill="url(#glowF)"/><circle cx="690" cy="320" r="14" fill="url(#ledFade)" stroke="#8c3a32" stroke-width="1.5"/></g>
  <!-- draining arrows -->
  <path d="M565 250 L565 285" fill="none" stroke="#0E6274" stroke-width="2.5" stroke-dasharray="2 5" marker-end="url(#arrC)"/>
  <text x="470" y="250" font-size="12.5" fill="#0E6274">suelta la carga</text>
  <text x="470" y="267" font-size="12.5" fill="#0E6274">poco a poco</text>
  <text x="605" y="372" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">Alimenta el LED y</text>
  <text x="605" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">la luz baja despacio</text>
</svg>
