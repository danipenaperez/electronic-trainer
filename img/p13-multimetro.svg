<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="mmBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b53a"/><stop offset="1" stop-color="#d8952a"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7e6d0"/><stop offset="1" stop-color="#a9d3b8"/></linearGradient>
    <linearGradient id="battBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#254a75"/></linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f2ee"/><stop offset="0.5" stop-color="#c9cbc4"/><stop offset="1" stop-color="#9a9c94"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panel)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>

  <!-- multimeter -->
  <g filter="url(#soft)">
    <rect x="90" y="120" width="280" height="320" rx="24" fill="url(#mmBody)" stroke="#b57e20" stroke-width="2"/>
    <rect x="120" y="150" width="220" height="110" rx="10" fill="url(#screen)" stroke="#7fae8f" stroke-width="2"/>
    <text x="325" y="238" text-anchor="end" font-size="56" font-weight="800" fill="#1f4a2e" font-family="'IBM Plex Mono',monospace">4.48</text>
    <text x="140" y="185" font-size="18" font-weight="700" fill="#3a6a4c">V</text>
    <!-- dial -->
    <circle cx="230" cy="340" r="66" fill="#2b2f34"/>
    <circle cx="230" cy="340" r="66" fill="none" stroke="#151719" stroke-width="4"/>
    <g stroke="#e9e4d6" stroke-width="3">
      <line x1="230" y1="284" x2="230" y2="298"/><line x1="286" y1="340" x2="272" y2="340"/>
      <line x1="230" y1="396" x2="230" y2="382"/><line x1="174" y1="340" x2="188" y2="340"/>
    </g>
    <text x="230" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5a10">V</text>
    <text x="300" y="345" font-size="12" font-weight="700" fill="#7a5a10">Ω</text>
    <text x="230" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5a10">A</text>
    <!-- pointer to V -->
    <line x1="230" y1="340" x2="230" y2="300" stroke="#ffcf4d" stroke-width="7" stroke-linecap="round"/>
    <!-- jacks -->
    <circle cx="180" cy="418" r="10" fill="#111" stroke="#000"/>
    <circle cx="280" cy="418" r="10" fill="#b23a2e" stroke="#7d2019"/>
  </g>

  <!-- probes to battery -->
  <path d="M280 428 C 420 470, 520 430, 560 360" fill="none" stroke="#c0322a" stroke-width="8" stroke-linecap="round"/>
  <path d="M180 428 C 300 470, 480 470, 560 420" fill="none" stroke="#3b3f45" stroke-width="8" stroke-linecap="round"/>
  <!-- probe tips -->
  <rect x="556" y="352" width="10" height="26" rx="3" fill="#c0322a"/>
  <rect x="556" y="410" width="10" height="18" rx="3" fill="#1c1f24"/>

  <!-- battery under test -->
  <g filter="url(#soft)">
    <rect x="560" y="300" width="180" height="130" rx="14" fill="url(#battBody)"/>
    <rect x="576" y="316" width="148" height="40" rx="10" fill="url(#cell)" stroke="#7d7f78"/>
    <rect x="576" y="368" width="148" height="40" rx="10" fill="url(#cell)" stroke="#7d7f78"/>
    <text x="600" y="342" font-size="18" font-weight="700" fill="#5f6158">＋</text>
    <text x="700" y="396" font-size="20" font-weight="700" fill="#5f6158">−</text>
  </g>

  <!-- ohm's law reminder -->
  <g filter="url(#soft)">
    <rect x="470" y="120" width="280" height="70" rx="16" fill="#fff" stroke="#d8d0be" stroke-width="2"/>
    <text x="610" y="165" text-anchor="middle" font-size="26" font-weight="800" fill="#8c4320" font-family="'IBM Plex Mono',monospace">V = I × R</text>
  </g>
</svg>
