<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panelTr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="sunTr" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#e6a72a"/></radialGradient>
    <radialGradient id="ledOnTr" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a8f"/><stop offset="0.5" stop-color="#f2493a"/><stop offset="1" stop-color="#c0261b"/></radialGradient>
    <radialGradient id="ledOffTr" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#c9b7b4"/><stop offset="0.5" stop-color="#9c7f7a"/><stop offset="1" stop-color="#6f5651"/></radialGradient>
    <radialGradient id="glowTr" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4d" stop-opacity="0.7"/><stop offset="1" stop-color="#ff6a52" stop-opacity="0"/></radialGradient>
    <linearGradient id="transBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4f57"/><stop offset="1" stop-color="#2a2d33"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panelTr)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="410" y1="70" x2="410" y2="410" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="410" y="462" text-anchor="middle" font-size="13.5" font-weight="700" fill="#853B6E">EL TRANSISTOR: UN INTERRUPTOR QUE UNA CORRIENTITA ABRE O CIERRA</text>

  <!-- ============ CON LUZ → APAGADO ============ -->
  <text x="205" y="98" text-anchor="middle" font-size="17" font-weight="800" fill="#1B2320">CON LUZ → APAGADO</text>
  <!-- LDR + sun -->
  <g><circle cx="150" cy="150" r="18" fill="url(#sunTr)"/><g stroke="#e6a72a" stroke-width="2.5" stroke-linecap="round"><line x1="150" y1="122" x2="150" y2="130"/></g><g stroke="#f0c04a" stroke-width="2.5"><line x1="166" y1="164" x2="188" y2="180"/></g>
    <rect x="185" y="140" width="46" height="34" rx="9" fill="#e9e6dd" stroke="#9aa0a6" stroke-width="2"/><path d="M193 157 q5 -9 10 0 q5 9 10 0" fill="none" stroke="#9E7115" stroke-width="2.6"/><text x="208" y="192" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4E5852">LDR</text></g>
  <path d="M205 200 L205 216" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="2 4"/>
  <!-- transistor OPEN -->
  <g><rect x="170" y="218" width="70" height="48" rx="9" fill="url(#transBody)"/>
    <circle cx="188" cy="242" r="4" fill="#8f939a"/><circle cx="222" cy="242" r="4" fill="#8f939a"/>
    <line x1="188" y1="242" x2="216" y2="228" stroke="#cfd3d6" stroke-width="4" stroke-linecap="round"/>
    <text x="205" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#4E5852">abierto</text></g>
  <path d="M205 296 L205 312" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="2 4"/>
  <!-- LED off -->
  <g><circle cx="205" cy="336" r="15" fill="url(#ledOffTr)" stroke="#5b4642" stroke-width="1.5"/></g>
  <text x="205" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#4E5852">no pasa → LED apagado</text>

  <!-- ============ A OSCURAS → ENCENDIDO ============ -->
  <text x="605" y="98" text-anchor="middle" font-size="17" font-weight="800" fill="#1B2320">A OSCURAS → ENCENDIDO</text>
  <!-- LDR dark (moon) -->
  <g><path d="M540 140 a17 17 0 1 0 14 24 a13 13 0 1 1 -14 -24 Z" fill="#b9c0c6"/>
    <rect x="585" y="140" width="46" height="34" rx="9" fill="#dcd8ce" stroke="#9aa0a6" stroke-width="2"/><path d="M593 157 q5 -9 10 0 q5 9 10 0" fill="none" stroke="#7a5a12" stroke-width="2.6"/><text x="608" y="192" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4E5852">LDR</text></g>
  <path d="M605 200 L605 216" fill="none" stroke="#853B6E" stroke-width="3" stroke-dasharray="2 4"/>
  <!-- transistor CLOSED -->
  <g><rect x="570" y="218" width="70" height="48" rx="9" fill="url(#transBody)"/>
    <circle cx="588" cy="242" r="4" fill="#8f939a"/><circle cx="622" cy="242" r="4" fill="#8f939a"/>
    <line x1="588" y1="242" x2="622" y2="242" stroke="#7fe08a" stroke-width="4" stroke-linecap="round"/>
    <text x="605" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#4E5852">cerrado</text></g>
  <path d="M605 296 L605 312" fill="none" stroke="#853B6E" stroke-width="3"/>
  <!-- LED on -->
  <g><circle cx="605" cy="336" r="28" fill="url(#glowTr)"/><circle cx="605" cy="336" r="15" fill="url(#ledOnTr)" stroke="#8c3a32" stroke-width="1.5"/></g>
  <text x="605" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#4E5852">pasa → LED encendido</text>
</svg>
