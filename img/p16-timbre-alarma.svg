<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="panelBz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <radialGradient id="buzzer" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#4a4f57"/><stop offset="1" stop-color="#26292e"/></radialGradient>
    <radialGradient id="sun2" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#e6a72a"/></radialGradient>
    <linearGradient id="battBz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#254a75"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="22" fill="url(#panelBz)"/>
  <rect x="0" y="0" width="820" height="500" rx="22" fill="none" stroke="#d3cbb8" stroke-width="2"/>
  <line x1="410" y1="70" x2="410" y2="420" stroke="#d8cfba" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="410" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#853B6E">EL ZUMBADOR CONVIERTE LA CORRIENTE EN SONIDO</text>

  <!-- ============ TIMBRE ============ -->
  <text x="205" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">TIMBRE</text>
  <!-- buzzer + sound waves -->
  <g><circle cx="205" cy="200" r="40" fill="url(#buzzer)"/><circle cx="205" cy="200" r="7" fill="#12131500"/><circle cx="205" cy="190" r="4" fill="#8f939a"/>
    <g stroke="#B0562A" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M258 178 A 30 30 0 0 1 258 222"/><path d="M274 168 A 46 46 0 0 1 274 232"/></g>
    <text x="292" y="150" font-size="22" fill="#B0562A">♪</text></g>
  <!-- button with finger arrow -->
  <g><rect x="150" y="300" width="110" height="46" rx="10" fill="#d7dade" stroke="#9aa0a6"/><circle cx="205" cy="323" r="15" fill="#c0322a"/>
    <path d="M205 268 L205 300" fill="none" stroke="#4E5852" stroke-width="2.5" stroke-dasharray="2 5"/><path d="M198 292 L205 302 L212 292" fill="none" stroke="#4E5852" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="205" y="262" text-anchor="middle" font-size="12.5" fill="#4E5852">aprieta</text></g>
  <text x="205" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">aprietas el pulsador → SUENA</text>

  <!-- ============ ALARMA ============ -->
  <text x="605" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1B2320">ALARMA (con la LDR)</text>
  <g><circle cx="605" cy="200" r="40" fill="url(#buzzer)"/><circle cx="605" cy="190" r="4" fill="#8f939a"/>
    <g stroke="#B0562A" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M658 178 A 30 30 0 0 1 658 222"/><path d="M674 168 A 46 46 0 0 1 674 232"/></g>
    <text x="692" y="150" font-size="22" fill="#B0562A">♪</text></g>
  <!-- LDR + sun -->
  <g><circle cx="520" cy="300" r="20" fill="url(#sun2)"/><g stroke="#e6a72a" stroke-width="2.5" stroke-linecap="round"><line x1="520" y1="272" x2="520" y2="280"/><line x1="497" y1="300" x2="505" y2="300"/></g>
    <g stroke="#f0c04a" stroke-width="2.5" stroke-linecap="round"><line x1="538" y1="314" x2="576" y2="330"/></g>
    <rect x="580" y="316" width="52" height="38" rx="10" fill="#e9e6dd" stroke="#9aa0a6" stroke-width="2"/><path d="M589 335 q6 -10 12 0 q6 10 12 0" fill="none" stroke="#9E7115" stroke-width="2.6"/><text x="606" y="372" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4E5852">LDR</text></g>
  <text x="605" y="404" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4E5852">la LDR detecta la luz → suena sola</text>
</svg>
